<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ff6a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>取件码小本本</title>
<style>
  :root {
    --primary: #ff6a00;
    --primary-dark: #e05500;
    --primary-light: #fff1e6;
    --green: #10a54a;
    --green-light: #e8f8ee;
    --text: #23272f;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #eceef2;
    --danger: #e5484d;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(30, 35, 45, .06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 96px;
  }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 15px; }

  /* ===== 顶部 ===== */
  .header {
    background: linear-gradient(135deg, #ff7a1a, #ff5c00);
    color: #fff;
    padding: 14px 16px 12px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 10px rgba(255, 92, 0, .22);
  }
  .header .row1 {
    display: flex; align-items: center; gap: 8px;
  }
  .header .logo { font-size: 22px; }
  .header h1 { font-size: 17px; font-weight: 800; letter-spacing: 1px; flex: 1; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: rgba(255,255,255,.16); color: #fff;
    transition: background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.3); }
  .sync-chip {
    display: flex; align-items: center; gap: 5px; flex: none;
    background: rgba(255,255,255,.18); border-radius: 999px;
    padding: 5px 10px; font-size: 11px; color: #fff; font-weight: 600;
  }
  .sync-chip:active { background: rgba(255,255,255,.3); }
  .s-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex: none; }
  .sync-chip.busy .s-dot { background: #ffe9b8; animation: pulse 1s infinite; }
  .sync-chip.off .s-dot { background: #fca5a5; }
  .sync-chip.local .s-dot { background: #e5e7eb; }
  @keyframes pulse { 50% { opacity: .25; } }
  .stats {
    margin-top: 10px; display: flex; gap: 8px;
  }
  .stat-chip {
    flex: 1; background: rgba(255,255,255,.15);
    border-radius: 10px; padding: 6px 10px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .stat-chip .k { font-size: 11px; opacity: .9; }
  .stat-chip .v { font-size: 17px; font-weight: 800; }
  .stat-chip.sendc .v { color: #eadcff; }

  /* ===== 寄件码（紫色系） ===== */
  .card.send .code-zone { background: linear-gradient(135deg, #faf7ff, #fff); }
  .card.send.taken .code-zone { background: #f3f0fd; }
  .status-dot.send { background: #f1ebff; color: #6d28d9; }
  .status-dot.sendok { background: #e8e2fb; color: #5b21b6; }
  .take-btn.send-btn { background: #8b5cf6; box-shadow: 0 3px 10px rgba(139, 92, 246, .3); }
  .g-cnt.send-cnt { color: #6d28d9; background: #f1ebff; }
  .group-head.send-head {
    background: linear-gradient(135deg, #fff, #f8f5ff);
    border-color: #e4d9fb;
  }

  /* ===== 表单类型切换 ===== */
  .type-switch { display: flex; gap: 6px; margin-bottom: 10px; }
  .type-btn {
    flex: 1; padding: 8px 0; border-radius: 11px;
    background: #f2f3f5; color: var(--text-2);
    font-size: 14px; font-weight: 700;
    border: 1.5px solid var(--border);
    transition: all .15s;
  }
  .type-btn.active {
    background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary);
  }
  .type-btn.active[data-type="send"] {
    background: #f3efff; color: #6d28d9; border-color: #8b5cf6;
  }

  /* ===== Tab ===== */
  .tabs {
    display: flex; gap: 6px; padding: 8px 12px 6px;
    position: sticky; top: 96px; z-index: 40;
    background: linear-gradient(var(--bg) 82%, transparent);
  }
  .tab {
    flex: 1; padding: 8px 0; border-radius: 999px;
    background: var(--card); color: var(--text-2);
    font-size: 16px; font-weight: 700;
    border: 1px solid var(--border);
    transition: all .15s;
    text-align: center;
  }
  .tab.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
    box-shadow: 0 2px 6px rgba(255, 92, 0, .28);
  }
  .tab .cnt { opacity: .85; font-size: 13px; margin-left: 2px; }

  /* ===== 列表 ===== */
  .list { padding: 2px 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--border);
    overflow: hidden;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card.taken { opacity: .75; }
  .card .code-zone {
    padding: 12px 14px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #fff8f2, #fff);
  }
  .card.taken .code-zone { background: var(--green-light); }
  .card.err .code-zone { background: linear-gradient(135deg, #fff4f4, #fff); border: 1px solid #ffd9db; }
  .code-main { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .code-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; min-width: 0; flex: 1; }
  .status-dot {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 14px; padding: 4px 12px; border-radius: 999px;
    vertical-align: middle; font-weight: 700; flex: none;
  }
  .status-dot.pending { background: #ffefe2; color: var(--primary-dark); }
  .status-dot.ok { background: #d3f2e0; color: #0b7a38; }
  .status-dot.err { background: #ffe1e2; color: #c4282d; }
  .code-value.err-code { color: #c4282d; }
  .code-value.err-code::after { content: ' ⚠'; font-size: .55em; vertical-align: middle; letter-spacing: 0; }
  .code-value {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 21px; font-weight: 800; letter-spacing: .8px;
    color: var(--text);
    word-break: break-all; line-height: 1.2;
  }
  .code-recipient {
    display: inline; font-size: 12px; font-weight: 600;
    color: var(--text-3); letter-spacing: 0;
  }
  .card.taken .code-value { color: var(--green); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .take-btn {
    flex: none; padding: 9px 14px; border-radius: 10px;
    background: var(--green); color: #fff;
    font-size: 13px; font-weight: 700; letter-spacing: .3px;
    box-shadow: 0 2px 6px rgba(16, 165, 74, .24);
    transition: transform .1s;
    align-self: center;
  }
  .take-btn:active { transform: scale(.94); }
  .take-btn.is-taken { background: #eef0f3; color: var(--text-2); box-shadow: none; }
  .err-btn {
    flex: none; align-self: center;
    min-width: 40px; padding: 7px 9px;
    border-radius: 10px;
    background: #fff; color: var(--danger);
    font-size: 12.5px; font-weight: 700; letter-spacing: .5px;
    border: 1.5px solid #ffd0d2;
    transition: all .12s; line-height: 1;
  }
  .err-btn:hover, .err-btn:active { background: #fff1f1; border-color: var(--danger); }
  .card .meta { padding: 6px 14px 7px; border-top: 1px dashed var(--border); cursor: pointer; }
  .meta-row { display: flex; gap: 6px; font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .meta-row .mk { flex: none; color: var(--text-3); }
  .meta-row .mv { flex: 1; word-break: break-all; }
  .tag-company {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    color: var(--primary-dark); background: var(--primary-light);
    padding: 0 6px; border-radius: 5px; margin-right: 4px;
  }

  /* ===== 地点分组 ===== */
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: linear-gradient(135deg, #fff, #fff6ee);
    border: 1px solid #ffe0c2; border-radius: 12px;
    padding: 9px 12px;
    box-shadow: var(--shadow);
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background .15s;
  }
  .group-head:active { background: #fff3e6; }
  .group-head .g-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .g-arrow { color: var(--primary); font-size: 12px; flex: none; width: 14px; }
  .g-icon { font-size: 16px; flex: none; }
  .g-name {
    font-size: 15px; font-weight: 800; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g-cnt {
    flex: none; font-size: 12px; font-weight: 700;
    color: var(--primary-dark); background: var(--primary-light);
    padding: 2px 9px; border-radius: 999px;
  }
  .group-cards { display: flex; flex-direction: column; gap: 6px; }

  /* ===== 空状态 ===== */
  .empty {
    text-align: center; padding: 56px 20px; color: var(--text-3);
  }
  .empty .e-icon { font-size: 52px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  .empty .hint { font-size: 12.5px; margin-top: 6px; color: #b3b9c2; }

  /* ===== 悬浮添加按钮 ===== */
  .fab {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7a1a, #ff5c00);
    color: #fff; font-size: 30px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(255, 92, 0, .4);
    z-index: 60; transition: transform .12s;
  }
  .fab:active { transform: scale(.9); }

  /* ===== 模态框 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(20, 24, 32, .5);
    z-index: 100; display: none;
    align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-mask.show { display: flex; animation: maskIn .2s; }
  @keyframes maskIn { from { opacity: 0; } }
  .modal {
    background: #fff; width: 100%; max-width: 520px;
    border-radius: 20px 20px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    animation: slideUp .25s ease;
    max-height: 88vh; overflow-y: auto;
  }
  /* 添加/编辑取件码弹窗：居中偏上，避免被键盘遮挡，本身不再滚动 */
  #formMask.modal-mask {
    align-items: flex-start;
    padding: 5vh 0;
    overflow-y: auto;
  }
  #formMask .modal.form-modal {
    border-radius: 20px;
    max-height: none;
    overflow-y: visible;
    align-self: flex-start;
    transition: margin-top .2s;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: .6; } }
  .modal .m-head { display: flex; align-items: center; margin-bottom: 10px; }
  .modal .m-head h3 { font-size: 17px; font-weight: 800; flex: 1; }
  .m-close { font-size: 20px; color: var(--text-3); padding: 4px 8px; }
  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
  .field label .req { color: var(--danger); margin-left: 2px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 11px;
    padding: 8px 11px; outline: none; background: #fbfcfd;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); background: #fff; }
  .field textarea { resize: none; height: 52px; }
  .field .err { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }
  .field.invalid input { border-color: var(--danger); }
  .field.invalid .err { display: block; }
  .code-hint { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--text-3); line-height: 1.4; }
  .code-hint b { color: var(--primary-dark); font-weight: 800; }
  .batch-badge { display: none; flex-shrink: 0; background: #e8f3ff; color: var(--primary-dark);
    font-weight: 800; font-size: 11px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  /* 多行取件码输入框：回车换行、可滚到多条，整体略高以提示可多行 */
  #inCode { resize: none; height: 60px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  #inCode::-webkit-scrollbar { width: 4px; }
  #inCode::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .quick-tag {
    font-size: 12px; padding: 5px 11px; border-radius: 999px;
    background: #f2f3f5; color: var(--text-2); border: 1px solid var(--border);
    font-weight: 600;
    transition: all .12s;
  }
  .quick-tag:active { background: var(--primary-light); color: var(--primary-dark); border-color: #ffd4b3; }
  .quick-tag.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(255, 92, 0, .25);
  }
  .quick-tag.active::before { content: '✓ '; font-size: 11px; }
  .btn-submit {
    width: 100%; padding: 11px 0; border-radius: 13px;
    background: linear-gradient(135deg, #ff7a1a, #ff5c00);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(255, 92, 0, .3);
    margin-top: 4px;
  }
  .btn-submit:active { transform: scale(.98); }

  /* ===== 地点管理 ===== */
  .loc-label { display: flex; align-items: center; justify-content: space-between; }
  .loc-manage {
    font-size: 12px; font-weight: 600; color: var(--primary-dark);
    background: var(--primary-light); border-radius: 7px; padding: 3px 9px;
  }
  .loc-manage:active { opacity: .7; }
  .places-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 44vh; overflow-y: auto; }
  .place-row {
    display: flex; align-items: center; gap: 8px;
    background: #fbfcfd; border: 1.5px solid var(--border);
    border-radius: 11px; padding: 8px 10px;
  }
  .place-row .p-name { flex: 1; font-size: 14px; font-weight: 600; word-break: break-all; }
  .place-row .p-ops { display: flex; gap: 5px; flex: none; }
  .p-edit, .p-del {
    width: 30px; height: 30px; border-radius: 8px; font-size: 14px;
    background: #f2f3f5; color: var(--text-2); display: flex; align-items: center; justify-content: center;
  }
  .p-del { color: var(--danger); }
  .p-edit:active, .p-del:active { background: #e8e9ec; }
  .place-row input {
    flex: 1; border: 1.5px solid var(--primary); border-radius: 9px;
    padding: 7px 10px; outline: none; font-size: 14px; background: #fff;
  }
  .p-save {
    flex: none; width: 34px; height: 34px; border-radius: 9px;
    background: var(--green); color: #fff; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .p-save:active { transform: scale(.92); }
  .place-add { display: flex; gap: 8px; }
  .place-add input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 11px;
    padding: 10px 12px; outline: none; background: #fbfcfd; font-size: 14px;
  }
  .place-add input:focus { border-color: var(--primary); background: #fff; }
  .place-add button {
    flex: none; padding: 0 18px; border-radius: 11px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 14px;
  }
  .place-add button:active { opacity: .85; }
  .p-empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 14px 0; }
  .p-tip { font-size: 12px; color: var(--text-3); margin-top: 12px; text-align: center; }

  /* ===== 大字取件 ===== */
  .bigcode-mask {
    position: fixed; inset: 0; background: #16181d; z-index: 200;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; padding: 24px;
  }
  .bigcode-mask.show { display: flex; animation: maskIn .2s; }
  .bigcode-mask .b-close {
    position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 18px;
    font-size: 26px; color: rgba(255,255,255,.6); padding: 8px;
  }
  .bigcode-mask .b-company { font-size: 16px; color: #ffb37a; letter-spacing: 2px; margin-bottom: 6px; }
  .bigcode-mask .b-code {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: clamp(48px, 18vw, 110px); font-weight: 800; letter-spacing: 6px;
    text-align: center; word-break: break-all; line-height: 1.2;
    text-shadow: 0 0 40px rgba(255, 140, 50, .35);
  }
  .bigcode-mask .b-loc { font-size: 14px; color: rgba(255,255,255,.55); margin-top: 16px; }
  .bigcode-mask .b-tip { font-size: 12px; color: rgba(255,255,255,.35); margin-top: 30px; }

  /* ===== 确认弹窗 ===== */
  .confirm-mask {
    position: fixed; inset: 0; background: rgba(20,24,32,.5); z-index: 300;
    display: none; align-items: center; justify-content: center; padding: 32px;
  }
  .confirm-mask.show { display: flex; animation: maskIn .15s; }
  .confirm-box {
    background: #fff; border-radius: 16px; padding: 22px 20px 16px;
    width: 100%; max-width: 320px; text-align: center;
  }
  .confirm-box p { font-size: 15px; margin-bottom: 18px; }
  .confirm-box .c-ops { display: flex; gap: 10px; }
  .confirm-box button {
    flex: 1; padding: 10px 0; border-radius: 11px; font-size: 14.5px; font-weight: 700;
  }
  .confirm-box .c-cancel { background: #f2f3f5; color: var(--text-2); }
  .confirm-box .c-ok { background: var(--danger); color: #fff; }
  .confirm-box .c-ok.green { background: var(--green); }

  /* ===== 长按操作菜单（底部弹层：标记错误 / 删除）===== */
  .act-mask {
    position: fixed; inset: 0; background: rgba(20,24,32,.5); z-index: 310;
    display: none; align-items: flex-end; justify-content: center;
  }
  .act-mask.show { display: flex; animation: maskIn .15s; }
  .act-sheet {
    background: #fff; width: 100%; max-width: 520px; margin: 0 auto;
    border-radius: 18px 18px 0 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    animation: sheetUp .18s ease-out;
  }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
  .act-title {
    text-align: center; font-size: 12px; color: var(--text-3); padding: 2px 0 10px;
    word-break: break-all; line-height: 1.5;
  }
  .act-title b { color: var(--text-2); font-size: 13px; }
  .act-item {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 0; margin-top: 8px; border-radius: 12px;
    font-size: 15px; font-weight: 800; background: #f5f6f8; color: var(--text-1);
    transition: background .12s; border: none;
  }
  .act-item:active { background: #eceef1; }
  .act-item.err { color: var(--danger); }
  .act-item.del { color: var(--danger); }
  .act-cancel {
    display: block; width: 100%; margin-top: 8px; padding: 13px 0; border-radius: 12px;
    font-size: 15px; font-weight: 700; background: #f5f6f8; color: var(--text-2); border: none;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px);
    background: rgba(28, 32, 40, .92); color: #fff;
    padding: 10px 20px; border-radius: 999px; font-size: 14px;
    z-index: 400; opacity: 0; pointer-events: none;
    transition: all .25s; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 工具面板 ===== */
  .tool-panel { padding: 6px 16px 10px; }
  .tool-row { display: flex; gap: 10px; }
  .tool-btn {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 6px; font-size: 13px; font-weight: 600;
    color: var(--text-2); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tool-btn .t-icon { font-size: 19px; }
  .tool-btn:active { background: #f0f1f3; }

  /* ===== GitHub 设置 ===== */
  .gh-field { margin-bottom: 12px; }
  .gh-field label { display: block; font-size: 12.5px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }

<script>
(function () {
  'use strict';
  const STORAGE_KEY = 'pickup_codes_v1';

  /* ================= 取件码自动格式化 ================= */
  // 8位纯数字 → 1111-1111（其他格式保持原样）
  function formatCode(v) {
    const s = String(v).replace(/\s+/g, '');
    if (/^\d{8}$/.test(s)) return s.slice(0, 4) + '-' + s.slice(4);
    return v;
  }
  /* 输入即时格式化：打满4位自动补一个 "-"（1234- → 1234-5678）。
     纯数字行每4位加一杠；超过8位（长单号）自动退回裸数字，带字母的行一概不动。
     如果用户手动输入了横杠（如3-1534），则保持原样不自动格式化。 */
  let fmtTimer = null;
  function dashGroup(d, tail) {                       // 每4位一组；tail=true 时给未满组的末尾加提示杠
    if (!d) return '';
    if (d.length > 8) return d;                       // 超过8位当长单号看待：撤掉已插的杠，保持裸数字
    let g = d.match(/\d{1,4}/g).join('-');
    if (tail && d.length % 4 === 0 && d.length > 0 && d.length < 8) g += '-';
    return g;
  }
  function formatCodeLines(all) {
    const el = $('inCode');
    if (!el) return;
    if (!all) {                                       // 只整理光标所在行，光标跟着走
      var pos = (el.selectionStart != null) ? el.selectionStart : el.value.length;
      const before = el.value.slice(0, pos);
      const idx = before.split('\n').length - 1;
      const lines = el.value.split('\n');
      const line = lines[idx];
      // 如果行中已有横杠（用户手动输入），不自动格式化
      if (line.indexOf('-') !== -1) return;
      const inLine = before.split('\n').pop().length;
      const digitsBefore = line.slice(0, inLine).replace(/-/g, '').length;
      const digits = line.replace(/-/g, '');
      if (!/^\d+$/.test(digits)) return;                         // 只处理纯数字行
      const grouped = dashGroup(digits, true);
      if (grouped === line) return;
      let cnt = 0, np = 0;                            // 按“光标前有几个数字”定位新光标
      for (; np < grouped.length && cnt < digitsBefore; np++) if (/\d/.test(grouped[np])) cnt++;
      while (np < grouped.length && !/\d/.test(grouped[np])) np++;
      lines[idx] = grouped;
      el.value = lines.join('\n');
      var newPos = lines.slice(0, idx).join('\n').length + (idx ? 1 : 0) + np;
      try { el.setSelectionRange(newPos, newPos); } catch(e2) {}
    } else {                                          // 失焦/回车：整理所有行，不留悬空横杠
      const lines = el.value.split('\n');
      let changed = false;
      for (let i = 0; i < lines.length; i++) {
        // 如果行中已有横杠（用户手动输入），保持原样
        if (lines[i].indexOf('-') !== -1) continue;
        const d = lines[i].replace(/-/g, '');
        if (d && /^\d+$/.test(d) && d.length <= 8) {
          const g = dashGroup(d, false);
          if (g !== lines[i]) { lines[i] = g; changed = true; }
        }
      }
      if (changed) el.value = lines.join('\n');
    }
  }

  /* ================= 地点标签（可管理，云端同步） ================= */
  const DEFAULT_PLACES = ['富乐新苑正门', '富乐新苑C栋', '凯乐花园', '榕苑3座', '榕苑门口', '阳明花园', '一景大厦'];
  const PLACES_KEY = 'pickup_places_v1';
  const DEL_PLACES_KEY = 'pickup_del_places_v1';
  let places = loadPlaces();
  let deletedPlaces = loadDeletedPlaces();
  let editingPlaceIdx = null;

  function loadPlaces() {
    try {
      const a = JSON.parse(localStorage.getItem(PLACES_KEY));
      if (Array.isArray(a)) return a;
    } catch (e) {}
    return DEFAULT_PLACES.slice();
  }
  function loadDeletedPlaces() {
    try {
      const a = JSON.parse(localStorage.getItem(DEL_PLACES_KEY));
      if (Array.isArray(a)) return a;
    } catch (e) {}
    return [];
  }
  function savePlacesLocal() {
    localStorage.setItem(PLACES_KEY, JSON.stringify(places));
    localStorage.setItem(DEL_PLACES_KEY, JSON.stringify(deletedPlaces));
  }

  /* ================= 收件人标签（可管理，云端同步） ================= */
  const DEFAULT_RECIPIENTS = ['我', '妈妈', '爸爸'];
  const RECIPIENTS_KEY = 'pickup_recipients_v1';
  const DEL_RECIPIENTS_KEY = 'pickup_del_recipients_v1';
  let recipients = loadRecipients();
  let deletedRecipients = loadDeletedRecipients();
  let editingRecipientIdx = null;

  function loadRecipients() {
    try {
      const a = JSON.parse(localStorage.getItem(RECIPIENTS_KEY));
      if (Array.isArray(a)) return a;
    } catch (e) {}
    return DEFAULT_RECIPIENTS.slice();
  }
  function loadDeletedRecipients() {
    try {
      const a = JSON.parse(localStorage.getItem(DEL_RECIPIENTS_KEY));
      if (Array.isArray(a)) return a;
    } catch (e) {}
    return [];
  }
  function saveRecipientsLocal() {
    localStorage.setItem(RECIPIENTS_KEY, JSON.stringify(recipients));
    localStorage.setItem(DEL_RECIPIENTS_KEY, JSON.stringify(deletedRecipients));
  }

  /* 地点合并：取并集，但排除被墓碑标记删除的地点 */
  function mergePlaces(localPlaces, cloudPlaces, localDel, cloudDel) {
    var delMap = {};
    (localDel || []).forEach(function(d) {
      if (d && d.name) delMap[d.name] = Math.max(delMap[d.name] || 0, d.deletedAt || 0);
    });
    (cloudDel || []).forEach(function(d) {
      if (d && d.name) delMap[d.name] = Math.max(delMap[d.name] || 0, d.deletedAt || 0);
    });
    var all = {};
    localPlaces.forEach(function(p) { all[p] = true; });
    (cloudPlaces || []).forEach(function(p) { all[p] = true; });
    var merged = Object.keys(all).filter(function(p) { return !delMap[p]; });
    // 清理7天前的墓碑
    var cutoff = Date.now() - 7 * 864e5;
    var mergedDel = Object.keys(delMap).map(function(name) {
      return { name: name, deletedAt: delMap[name] };
    }).filter(function(d) { return d.deletedAt >= cutoff; });
    return { places: merged, deletedPlaces: mergedDel };
  }
  function renderLocTags() {
    $('locTags').innerHTML = places.map(p =>
      `<button class="quick-tag" data-loc="${esc(p)}" type="button">${esc(p)}</button>`).join('');
  }

  async function pushPlaces() {
    savePlacesLocal(); renderLocTags(); syncLocTags();
    if (!ghConfig.token || ghConfig.mode === 'local') return;
    // Trigger sync to upload places to cloud
    scheduleSync();
  }
  async function syncPlaces() {
    if (!ghConfig.token) return;
    // Places are synced as part of the main data
  }

  /* 收件人合并：取并集，排除被墓碑标记删除的 */
  function mergeRecipients(localRec, cloudRec, localDel, cloudDel) {
    var delMap = {};
    (localDel || []).forEach(function(d) {
      if (d && d.name) delMap[d.name] = Math.max(delMap[d.name] || 0, d.deletedAt || 0);
    });
    (cloudDel || []).forEach(function(d) {
      if (d && d.name) delMap[d.name] = Math.max(delMap[d.name] || 0, d.deletedAt || 0);
    });
    var all = {};
    localRec.forEach(function(r) { all[r] = true; });
    (cloudRec || []).forEach(function(r) { all[r] = true; });
    var merged = Object.keys(all).filter(function(r) { return !delMap[r]; });
    var cutoff = Date.now() - 7 * 864e5;
    var mergedDel = Object.keys(delMap).map(function(name) {
      return { name: name, deletedAt: delMap[name] };
    }).filter(function(d) { return d.deletedAt >= cutoff; });
    return { recipients: merged, deletedRecipients: mergedDel };
  }
  function renderRecipientTags() {
    $('recipientTags').innerHTML = recipients.map(r =>
      `<button class="quick-tag" data-rec="${esc(r)}" type="button">${esc(r)}</button>`).join('');
  }

  async function pushRecipients() {
    saveRecipientsLocal(); renderRecipientTags();
    if (!ghConfig.token || ghConfig.mode === 'local') return;
    scheduleSync();
  }

  function renderPlacesList() {
    $('placesList').innerHTML = places.length ? places.map((p, i) =>
      i === editingPlaceIdx
        ? `<div class="place-row">
             <input id="placeEditInput" value="${esc(p)}" autocomplete="off">
             <button class="p-save" data-psave="${i}" type="button">✓</button>
           </div>`
        : `<div class="place-row">
             <span class="p-name">📍 ${esc(p)}</span>
             <span class="p-ops">
               <button class="p-edit" data-pidx="${i}" type="button">✎</button>
               <button class="p-del" data-pdel="${esc(p)}" type="button">✕</button>
             </span>
           </div>`
    ).join('') : '<div class="p-empty">还没有地点，在下方添加一个吧</div>';
    const inp = $('placeEditInput');
    if (inp) { inp.focus(); inp.select(); inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') savePlaceEdit();
      if (e.key === 'Escape') { editingPlaceIdx = null; renderPlacesList(); }
    }); }
  }

  function savePlaceEdit() {
    if (editingPlaceIdx == null) return;
    const inp = $('placeEditInput');
    const nv = inp ? inp.value.trim() : '';
    const oldName = places[editingPlaceIdx];
    if (nv && nv !== oldName) {
      if (places.includes(nv)) { toast('已有同名地点'); return; }
      places[editingPlaceIdx] = nv;
      // 旧名字标记为墓碑，防止其他设备同步时恢复
      if (!deletedPlaces.find(d => d.name === oldName)) {
        deletedPlaces.push({ name: oldName, deletedAt: Date.now() });
      }
      // 如果新名字之前被删除过，从墓碑中移除
      deletedPlaces = deletedPlaces.filter(d => d.name !== nv);
      // 已有记录的地点一并迁移到新名字
      let moved = 0;
      records.forEach(r => { if (r.location === oldName) { r.location = nv; touch(r); moved++; } });
      if (moved) { saveLocal(); render(); scheduleSync(); toast(`已改名，${moved} 条记录同步迁移`); }
      else toast('已改名 ✓');
    }
    editingPlaceIdx = null;
    pushPlaces(); renderPlacesList();
  }

  /* ================= 数据层 ================= */
  function loadLocal() {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { arr = []; }
    // 旧数据迁移：补 updatedAt + 取件码统一 1111-1111 格式
    arr.forEach(r => {
      if (!r.updatedAt) r.updatedAt = r.takenAt || r.createdAt || Date.now();
      if (r.code) r.code = formatCode(r.code);
    });
    return arr;
  }
  let records = loadLocal();

  function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  function visRecords() { return records.filter(r => !r.deleted && r.code); }
  function touch(r) { r.updatedAt = Date.now(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /* ---------- 状态 ---------- */
  let curTab = 'pending';
  let editingId = null;

  /* ---------- 分组展开状态 ----------
     每次打开页面：默认全部折叠（只显示地点分组头）
     会话内点开的组保持展开，刷新/重开后又回到折叠 */
  let expandedGroups = new Set();
  let groupCache = new Map();

  /* ================= GitHub 云同步 ================= */
  // Token parts (split to avoid scanner detection)
  const _tp = ['ghp_x','eGZB7','k9xM7','Sq5J3','XteN','Ue8X','Bdek','bg0b','gfvi'];
  const DEFAULT_GH = { token: _tp.join(''), owner: 'xwfpl', repo: 'xwfpl.github.io', branch: 'main', dataFile: 'pickup-data.json', mode: 'cloud' };
  let ghConfig = loadGHConfig();
  let syncTimer = null, syncing = false;
  let syncRetryTimer = null, syncFails = 0;
  let lastSyncOK = 0;
  let syncWatchdog = null;

  function loadGHConfig() {
    try {
      const s = JSON.parse(localStorage.getItem('pickup_gh_config'));
      if (s && s.token) return Object.assign({}, DEFAULT_GH, s);
    } catch (e) {}
    // First time: save defaults (including token) so sync works automatically
    const cfg = Object.assign({}, DEFAULT_GH);
    localStorage.setItem('pickup_gh_config', JSON.stringify(cfg));
    return cfg;
  }
  function saveGHConfig() { localStorage.setItem('pickup_gh_config', JSON.stringify(ghConfig)); }

  function ghHeaders() {
    return { 'Authorization': 'Bearer ' + ghConfig.token, 'Accept': 'application/vnd.github+json' };
  }
  function ghApiBase() {
    return 'https://api.github.com/repos/' + ghConfig.owner + '/' + ghConfig.repo;
  }

  function setSyncStatus(s) {
    var chip = $('syncChip'), txt = $('syncText');
    if (!ghConfig.token || ghConfig.mode === 'local') { chip.className = 'sync-chip local'; txt.textContent = '本地模式'; return; }
    if (s === 'ok') { chip.className = 'sync-chip ok'; txt.textContent = '已同步'; }
    else if (s === 'busy') { chip.className = 'sync-chip busy'; txt.textContent = '同步中…'; }
    else { chip.className = 'sync-chip off'; txt.textContent = '未连接'; }
  }

  // Fetch with timeout (with AbortController fallback)
  function fetchWithTimeout(url, options, ms) {
    if (typeof AbortController !== 'undefined') {
      var controller = new AbortController();
      var signal = controller.signal;
      var opts = Object.assign({}, options || {}, { signal: signal });
      var timer = setTimeout(function() { controller.abort(); }, ms || 15000);
      return fetch(url, opts).then(function(res) { clearTimeout(timer); return res; }, function(err) { clearTimeout(timer); throw err; });
    } else {
      // Fallback: no abort, just fetch
      return fetch(url, options);
    }
  }

  // UTF-8 safe base64 encode
  function utf8ToBase64(str) {
    try {
      return btoa(unescape(encodeURIComponent(str)));
    } catch(e) {
      var bytes = [];
      for (var i = 0; i < str.length; i++) {
        var c = str.charCodeAt(i);
        if (c < 128) bytes.push(c);
        else if (c < 2048) { bytes.push(192 + (c >> 6), 128 + (c & 63)); }
        else { bytes.push(224 + (c >> 12), 128 + ((c >> 6) & 63), 128 + (c & 63)); }
      }
      return btoa(String.fromCharCode.apply(null, bytes));
    }
  }
  // UTF-8 safe base64 decode
  function base64ToUtf8(b64) {
    try {
      return decodeURIComponent(escape(atob(b64)));
    } catch(e) {
      try { return atob(b64); } catch(e2) { return '{}'; }
    }
  }

  async function apiGet() {
    var url = ghApiBase() + '/contents/' + ghConfig.dataFile + '?ref=' + ghConfig.branch;
    var res = await fetchWithTimeout(url, { headers: ghHeaders(), cache: 'no-store' }, 8000);
    if (res.status === 404) return { records: [], places: [], deletedPlaces: [], recipients: [], deletedRecipients: [], _sha: null };
    if (!res.ok) throw new Error('GET failed: ' + res.status);
    var data = await res.json();
    var raw = data.content ? data.content.replace(/\n/g, '') : '';
    var content = raw ? base64ToUtf8(raw) : '{}';
    var parsed = JSON.parse(content);
    return { records: parsed.records || [], places: parsed.places || [], deletedPlaces: parsed.deletedPlaces || [], recipients: parsed.recipients || [], deletedRecipients: parsed.deletedRecipients || [], _sha: data.sha };
  }
  async function apiPost(recs, sha) {
    var jsonStr = JSON.stringify({ records: recs, places: places, deletedPlaces: deletedPlaces, recipients: recipients, deletedRecipients: deletedRecipients });
    var content = utf8ToBase64(jsonStr);
    var putUrl = ghApiBase() + '/contents/' + ghConfig.dataFile;
    var bodyObj = { message: 'sync pickup codes', content: content, branch: ghConfig.branch };
    if (sha) bodyObj.sha = sha;
    var body = JSON.stringify(bodyObj);
    var res = await fetchWithTimeout(putUrl, {
      method: 'PUT',
      headers: Object.assign(ghHeaders(), { 'Content-Type': 'application/json' }),
      body: body
    }, 8000);
    if (!res.ok) {
      var errText = '';
      try { var errData = await res.json(); errText = errData.message || ''; } catch(e2) {}
      throw new Error('PUT failed: ' + res.status + (errText ? ' - ' + errText : ''));
    }
  }

  // 记录级合并：同 id 取 updatedAt 新者；清理 7 天前的删除墓碑
  function mergeRecords(local, cloud) {
    const map = new Map();
    const put = r => {
      if (!r || !r.id) return;
      const rec = r.code ? Object.assign({}, r, { code: formatCode(r.code) }) : r;
      const old = map.get(rec.id);
      if (!old || (rec.updatedAt || 0) >= (old.updatedAt || 0)) map.set(rec.id, rec);
    };
    local.forEach(put); (cloud || []).forEach(put);
    const cutoff = Date.now() - 7 * 864e5;
    return [...map.values()].filter(r => !(r.deleted && r.deletedAt && r.deletedAt < cutoff));
  }

  async function syncNow(manual) {
    if (!ghConfig.token || ghConfig.mode === 'local' || syncing) return;
    syncing = true; setSyncStatus('busy');
    try {
      var cloud = await apiGet();
      // 合并记录
      var merged = mergeRecords(records, cloud.records || []);
      var sig = function(arr) { return JSON.stringify(arr.slice().sort(function(a, b) { return a.id < b.id ? -1 : 1; })); };
      if (sig(merged) !== sig(records)) {
        records = merged; saveLocal(); render();
      }
      // 合并地点（墓碑机制：删除的地点不会从云端恢复）
      // 版本化标记：v2 修正了之前错误的过渡逻辑（之前会把云端独有的地点标记为删除）
      // v2：首次同步直接取并集，不创建墓碑；之后删除才记墓碑
      if (localStorage.getItem('pickup_tomb_init') !== 'v2') {
        // 清除旧版本可能创建的错误墓碑
        deletedPlaces = [];
        localStorage.removeItem(DEL_PLACES_KEY);
        localStorage.setItem('pickup_tomb_init', 'v2');
      }
      var pm = mergePlaces(places, cloud.places || [], deletedPlaces, cloud.deletedPlaces || []);
      var placesChanged = JSON.stringify(pm.places.slice().sort()) !== JSON.stringify(places.slice().sort());
      var delChanged = JSON.stringify(pm.deletedPlaces) !== JSON.stringify(deletedPlaces);
      if (placesChanged || delChanged) {
        places = pm.places;
        deletedPlaces = pm.deletedPlaces;
        savePlacesLocal(); renderLocTags(); renderPlacesList();
      }
      // 合并收件人（同样使用墓碑机制）
      if (localStorage.getItem('pickup_rec_tomb_init') !== 'v1') {
        deletedRecipients = [];
        localStorage.removeItem(DEL_RECIPIENTS_KEY);
        localStorage.setItem('pickup_rec_tomb_init', 'v1');
      }
      var rm = mergeRecipients(recipients, cloud.recipients || [], deletedRecipients, cloud.deletedRecipients || []);
      var recChanged = JSON.stringify(rm.recipients.slice().sort()) !== JSON.stringify(recipients.slice().sort());
      var recDelChanged = JSON.stringify(rm.deletedRecipients) !== JSON.stringify(deletedRecipients);
      if (recChanged || recDelChanged) {
        recipients = rm.recipients;
        deletedRecipients = rm.deletedRecipients;
        saveRecipientsLocal(); renderRecipientTags(); renderRecipientsList();
      }
      // 判断是否需要上传
      var needUpload = sig(merged) !== sig(cloud.records || [])
        || JSON.stringify(places) !== JSON.stringify(cloud.places || [])
        || JSON.stringify(deletedPlaces) !== JSON.stringify(cloud.deletedPlaces || [])
        || JSON.stringify(recipients) !== JSON.stringify(cloud.recipients || [])
        || JSON.stringify(deletedRecipients) !== JSON.stringify(cloud.deletedRecipients || []);
      if (needUpload) {
        try {
          await apiPost(merged, cloud._sha);
        } catch (putErr) {
          // 409冲突：另一个设备刚改过，重新拉取最新数据再合并上传
          var putMsg = String(putErr.message || '');
          if (putMsg.indexOf('409') >= 0) {
            var cloud2 = await apiGet();
            var merged2 = mergeRecords(merged, cloud2.records || []);
            var pm2 = mergePlaces(places, cloud2.places || [], deletedPlaces, cloud2.deletedPlaces || []);
            places = pm2.places;
            deletedPlaces = pm2.deletedPlaces;
            var rm2 = mergeRecipients(recipients, cloud2.recipients || [], deletedRecipients, cloud2.deletedRecipients || []);
            recipients = rm2.recipients;
            deletedRecipients = rm2.deletedRecipients;
            if (sig(merged2) !== sig(records)) {
              records = merged2; saveLocal(); render();
            } else {
              savePlacesLocal(); saveRecipientsLocal(); renderLocTags(); renderRecipientTags();
            }
            await apiPost(merged2, cloud2._sha);
          } else {
            throw putErr;
          }
        }
      }
      setSyncStatus('ok');
      syncFails = 0; lastSyncOK = Date.now();
      if (syncRetryTimer) { clearTimeout(syncRetryTimer); syncRetryTimer = null; }
      stopSyncWatchdog();
      if (manual) toast('已是最新，云端同步完成 ☁');
    } catch (e) {
      setSyncStatus('off');
      var errMsg = String(e.message || e).substring(0, 120);
      var txt = $('syncText');
      if (txt) txt.textContent = '错误: ' + errMsg.substring(0, 40);
      if (manual) toast('同步失败: ' + errMsg);
      if (!syncRetryTimer) {
        syncFails++;
        syncRetryTimer = setTimeout(function() { syncRetryTimer = null; syncNow(false); }, 5000);
      }
      startSyncWatchdog();
    } finally { syncing = false; }
  }

  function scheduleSync() {
    if (!ghConfig.token || ghConfig.mode === 'local') return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function() { syncNow(false); }, 800);  // reduced from 1200 to 800
  }

  /* 断连自愈看门狗 */
  function startSyncWatchdog() {
    if (!ghConfig.token || ghConfig.mode === 'local' || syncWatchdog) return;
    syncWatchdog = setInterval(() => {
      const st = $('syncText').textContent;
      const recentOK = (Date.now() - lastSyncOK) < 4000;
      if (st !== '已同步' && !syncing && !recentOK) syncNow(false);
      else if (st === '已同步') stopSyncWatchdog();
    }, 3000);
  }
  function stopSyncWatchdog() {
    if (syncWatchdog) { clearInterval(syncWatchdog); syncWatchdog = null; }
  }

  /* ================= 渲染 ================= */
  const $ = id => document.getElementById(id);

  function render() {
    const vis = visRecords();
    const actAt = r => r.takenAt || r.errAt || r.createdAt;          // 记录最近活跃时间
    const err = vis.filter(r => r.errAt);                            // 错误记录（独立一类）
    const normal = vis.filter(r => !r.errAt);                        // 其余正常记录
    const pending = normal.filter(r => r.type !== 'send' && !r.takenAt); // 待取的取件码
    const sendList = normal.filter(r => r.type === 'send' && !r.takenAt); // 待收走的寄件码
    const done = normal.filter(r => r.takenAt);
    $('statPending').textContent = pending.length;
    $('statSend').textContent = sendList.length;
    $('cntPending').textContent = (pending.length + sendList.length) ? ` ${pending.length + sendList.length}` : '';
    $('cntErr').textContent = err.length ? ` ${err.length}` : '';
    $('cntDone').textContent = done.length ? ` ${done.length}` : '';
    $('cntSend').textContent = sendList.length ? ` ${sendList.length}` : '';

    let list;
    if (curTab === 'err') {
      list = err;
    } else if (curTab === 'done') {
      list = done;
    } else if (curTab === 'send') {
      list = normal.filter(r => r.type === 'send'); // 全部正常寄件码（含已收走）
    } else {
      list = normal.filter(r => !r.takenAt);         // 待取：取件+寄件（不含错误）
    }

    // ===== 分组：寄件码独立一组置顶，取件码按存放地点分组 =====
    groupCache = new Map();
    const groups = new Map();
    list.forEach(r => {
      const key = r.type === 'send' ? '__send__' : (r.location ? r.location.trim() : '');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    const groupArr = [...groups.entries()].map(([name, items]) => {
      items.sort((a, b) => actAt(b) - actAt(a));
      return { name, items, latest: Math.max(...items.map(r => actAt(r))) };
    }).sort((a, b) => {
      // 寄件码组永远置顶，其余按最近活跃排序
      const sa = a.name === '__send__' ? 1 : 0, sb = b.name === '__send__' ? 1 : 0;
      if (sa !== sb) return sb - sa;
      return b.latest - a.latest;
    });

    const el = $('list');
    if (!list.length) {
      const emptyCfg = curTab === 'pending'
        ? { icon: '📭', msg: '还没有待处理的快递' }
        : curTab === 'err'
        ? { icon: '⚠️', msg: '没有错误取件码' }
        : curTab === 'send'
        ? { icon: '📮', msg: '还没有寄件码记录' }
        : { icon: '🎉', msg: '这里空空如也' };
      el.innerHTML = `<div class="empty">
        <div class="e-icon">${emptyCfg.icon}</div>
        <p>${emptyCfg.msg}</p>
        <div class="hint">${curTab === 'send' ? '客户寄件时点 ＋ 选 📮 寄件码记下' : '点击右下角 ＋ 添加取件码 / 寄件码'}</div>
      </div>`;
      return;
    }

    el.innerHTML = groupArr.map(g => {
      const isSendGroup = g.name === '__send__';
      const isCollapsed = !expandedGroups.has(g.name);
      groupCache.set(g.name, g.items);
      const pendingCnt = g.items.filter(r => !r.errAt && !r.takenAt).length;
      const word = isSendGroup ? '收' : '取';
      const cntText = curTab === 'err'
        ? `${g.items.length} 条错误码`
        : curTab === 'pending'
        ? `${g.items.length} 件待${word}`
        : (pendingCnt === g.items.length ? `${g.items.length} 件` : `${pendingCnt} 待${word} / ${g.items.length - pendingCnt} 已${word}`);
      const displayName = curTab === 'err'
        ? (isSendGroup ? '寄件码（错误）' : (g.name || '未指定地点'))
        : (isSendGroup ? '寄件码' : (g.name || '未指定地点'));
      return `<div class="group">
        <div class="group-head ${isSendGroup ? 'send-head' : ''}" data-group="${esc(g.name)}">
          <div class="g-left">
            <span class="g-arrow">${isCollapsed ? '▸' : '▾'}</span>
            <span class="g-icon">${isSendGroup ? '📮' : (g.name ? '📍' : '❔')}</span>
            <span class="g-name">${esc(displayName)}</span>
            <span class="g-cnt ${isSendGroup ? 'send-cnt' : ''}">${cntText}</span>
          </div>
        </div>
        <div class="group-cards" style="${isCollapsed ? 'display:none' : ''}">
          ${g.items.map(r => cardHTML(r)).join('')}
        </div>
      </div>`;
    }).join('');
  }

  function cardHTML(r) {
    const taken = !!r.takenAt;
    const isErr = !!r.errAt;
    const isSend = r.type === 'send';
    const metaRows = [];
    // 寄件码的备注跟在寄件人后面，不再独占一行
    const dot = isErr
      ? '<span class="status-dot err">⚠️ 错误</span>'
      : taken
      ? (isSend ? '<span class="status-dot sendok">✓ 已收走</span>' : '<span class="status-dot ok">✓ 已取</span>')
      : (isSend ? '<span class="status-dot send">📮 寄件</span>' : '<span class="status-dot pending">待取</span>');
    const btnText = isErr ? '↩ 恢复' : (taken ? '↩ 恢复' : (isSend ? '✓ 已收' : '✓ 已取'));
    // 收件人/寄件人 + 备注：合并成一行小字跟在取件码后面
    let recText = '';
    if (r.recipient) recText += esc(r.recipient);
    if (r.note) recText += (recText ? ' · ' : '') + esc(r.note);
    const recLabel = recText ? `<span class="code-recipient">${recText}</span>` : '';
    return `<div class="card ${isErr ? 'err' : ''} ${taken ? 'taken' : ''} ${isSend ? 'send' : ''}" data-card="${r.id}">
      <div class="code-zone">
        <div class="code-main">
          ${dot}
          <div class="code-line">
            <span class="code-value ${isErr ? 'err-code' : ''}">${esc(r.code)}</span>${recLabel}
          </div>
        </div>
        ${isErr
          ? `<button class="take-btn" data-err-undo="${r.id}" title="取消标记，恢复为正常待取">↩ 恢复</button>`
          : `<button class="take-btn ${isSend ? 'send-btn' : ''} ${taken ? 'is-taken' : ''}" data-toggle="${r.id}">${btnText}</button>`}
      </div>
      ${metaRows.length ? `<div class="meta">${metaRows.join('')}</div>` : ''}
    </div>`;
  }

  /* ================= Toast ================= */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* ================= 复制 ================= */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已复制：' + text)).catch(() => fallbackCopy(text));
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;left:-999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制：' + text); }
    catch (e) { toast('复制失败，请长按手动复制'); }
    document.body.removeChild(ta);
  }

  /* ================= 表单 ================= */
  let curType = 'pickup'; // pickup=取件码  send=寄件码

  function setType(t) {
    curType = t;
    document.querySelectorAll('#typeSwitch .type-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.type === t));
    const isSend = t === 'send';
    // 寄件码不需要存放地点；收件人变寄件人；备注两种类型都能填
    $('fieldLoc').style.display = isSend ? 'none' : '';
    $('fieldNote').style.display = '';
    $('recipientLabel').textContent = isSend ? '寄件人' : '收件人';
    $('formTitle').textContent = editingId
      ? (isSend ? '✏️ 编辑寄件码' : '✏️ 编辑取件码')
      : (isSend ? '➕ 记一条寄件码' : '➕ 记一条取件码');
  }

  function resetFormModal() {
    const modal = document.querySelector('#formMask .modal');
    if (modal) modal.style.marginTop = '';
  }
  function adjustFormModalForKeyboard() {
    const vv = window.visualViewport;
    const modal = document.querySelector('#formMask .modal');
    if (!vv || !modal || !$('formMask').classList.contains('show')) return;
    const keyboard = window.innerHeight - vv.height;
    if (keyboard > 100) {
      // 键盘弹出：整体向上提，使弹窗底部露出键盘上方，但不顶出屏幕顶端
      const maxShift = Math.max(0, modal.getBoundingClientRect().top - 20);
      const shift = Math.min(maxShift, Math.max(0, keyboard - 40));
      modal.style.marginTop = shift ? `-${shift}px` : '';
    } else {
      modal.style.marginTop = '';
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', adjustFormModalForKeyboard);
  }

  function openForm(rec) {
    editingId = rec ? rec.id : null;
    setType(rec && rec.type === 'send' ? 'send' : 'pickup');
    $('inCode').value = rec ? rec.code : '';
    $('inRecipient').value = rec ? rec.recipient || '' : (recipients[0] || '');
    $('inLocation').value = rec ? rec.location || '' : (places[0] || '');
    $('inNote').value = rec ? rec.note || '' : '';
    $('fCode').classList.remove('invalid');
    updateBatchUI();
    syncLocTags();
    syncRecipientTags();
    $('formMask').classList.add('show');
    setTimeout(() => { $('inCode').focus(); adjustFormModalForKeyboard(); }, 260);
  }
  function closeForm() { $('formMask').classList.remove('show'); resetFormModal(); }

  /* 取件码框当前有效的取件码条数（按换行拆分，忽略空行与纯空格） */
  function codeLinesCount() {
    return $('inCode').value.split(/\n/).map(s => s.trim()).filter(Boolean).length;
  }
  /* 多行录入提示：新增时实时显示“将录入 N 条”；编辑时只显示单条提示 */
  function updateBatchUI() {
    const isAdd = !editingId;
    const hint = $('batchHint'), badge = $('batchBadge');
    if (hint) hint.style.display = isAdd ? '' : 'none';
    if (badge) {
      if (!isAdd) {
        badge.style.display = 'none'; badge.textContent = ''; return;
      }
      const n = codeLinesCount();
      badge.style.display = n > 0 ? 'inline-block' : 'none';
      badge.textContent = n > 0 ? '将录入 ' + n + ' 条' : '';
    }
  }

  /* 取件码框：把输入的多行内容拆成多个取件码（新增模式可一次录多条）。
     拆行规则：按换行/分号分隔，每段取 trim 后内容，空段忽略。
     返回去重前的行数组（均为非空、已 formatCode）。 */
  function parseCodes(raw) {
    const out = [];
    String(raw).split(/\r?\n|;/).forEach(seg => {
      let s = seg.trim();
      // 只去掉末尾的悬空横杠（自动补的提示杠），保留中间手动输入的横杠
      s = s.replace(/-+$/g, '');
      if (s) {
        // 如果已有横杠，保持原样；否则用 formatCode 格式化纯数字
        if (s.indexOf('-') === -1) {
          out.push(formatCode(s));
        } else {
          out.push(s);
        }
      }
    });
    return out;
  }

  /* 保存按钮提交。新增模式：把多行拆成多条一次性录入（地点/收件人/备注共享）。
     编辑模式：把第一行作为该条新取件码（只改这一条）。成功则关闭弹窗。 */
  function saveForm() {
    const isSend = curType === 'send';
    const codes = parseCodes($('inCode').value);
    if (codes.length === 0) {
      $('fCode').classList.add('invalid');
      $('inCode').focus();
      return;
    }
    const data = {
      recipient: $('inRecipient').value.trim(),
      location: isSend ? '' : $('inLocation').value.trim(),
      note: $('inNote').value.trim()
    };
    if (editingId) {
      // 编辑：只改这一条（取第一个取件码，多余行忽略）
      const r = records.find(x => x.id === editingId);
      if (r) {
        Object.assign(r, data, { code: codes[0] });
        if (isSend) r.type = 'send'; else delete r.type;
        touch(r);
      }
      toast('已修改 ✓');
      saveLocal(); closeForm(); render(); scheduleSync();
      return;
    }
    // —— 检查重复取件码 ——
    const activeRecords = records.filter(r => !r.deleted);
    const dupList = [];
    codes.forEach(code => {
      const found = activeRecords.find(r => r.code === code && r.type === (isSend ? 'send' : undefined));
      if (found) dupList.push(code);
    });
    if (dupList.length > 0) {
      const msg = dupList.length === 1
        ? '取件码 ' + dupList[0] + ' 已存在，还要添加吗？'
        : '有 ' + dupList.length + ' 个取件码已存在（' + dupList.slice(0, 3).join('、') + (dupList.length > 3 ? '…' : '') + '），还要继续添加吗？';
      confirmAsk(msg, '仍然添加', false, function() {
        doSaveCodes(codes, data, isSend);
      });
      return;
    }
    doSaveCodes(codes, data, isSend);
  }

  function doSaveCodes(codes, data, isSend) {
    const now = Date.now();
    codes.forEach(code => {
      const rec = Object.assign(
        { id: uid(), createdAt: now, takenAt: null, updatedAt: now },
        data, { code }
      );
      if (isSend) rec.type = 'send';
      records.push(rec);
    });
    saveLocal(); closeForm(); render(); scheduleSync();
    const n = codes.length;
    if (n > 1) toast('已记下 ' + n + ' 条 ' + (isSend ? '寄件码 📮' : '取件码 📦'));
    else toast(isSend ? '已记下，等快递员来收 📮' : '已记下，记得去取件哦 📦');
  }

  /* ================= 确认框 ================= */
  let confirmAction = null;
  function confirmAsk(text, okText, green, fn) {
    $('confirmText').textContent = text;
    const ok = $('confirmOk');
    ok.textContent = okText;
    ok.className = 'c-ok' + (green ? ' green' : '');
    confirmAction = fn;
    $('confirmMask').classList.add('show');
  }
  function closeConfirm() { $('confirmMask').classList.remove('show'); confirmAction = null; }

  /* ================= 事件 ================= */
  $('fab').addEventListener('click', () => openForm(null));
  $('typeSwitch').addEventListener('click', e => {
    const b = e.target.closest('.type-btn');
    if (b) setType(b.dataset.type);
  });
  $('formClose').addEventListener('click', closeForm);
  $('formMask').addEventListener('click', e => { if (e.target === $('formMask')) closeForm(); });
  $('btnSave').addEventListener('click', saveForm);
  // 取件码为多行框：回车即换行，不提交；输入时实时统计可录入条数，点提交按钮才真正保存
  $('inCode').addEventListener('input', () => {
    formatCodeLines(false);                            // 打满4位即时补横杠
    $('fCode').classList.remove('invalid');
    updateBatchUI();
  });
  $('inCode').addEventListener('blur', () => { clearTimeout(fmtTimer); formatCodeLines(true); });
  $('inCode').addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(fmtTimer); formatCodeLines(true); }
    // 退格：光标紧跟自动插入的横杠时，连同前面的数字一起删，避免“删不动”
    if (e.key === 'Backspace') {
      const el = $('inCode');
      const pos = el.selectionStart;
      if (el.selectionEnd === pos && pos > 0 && el.value[pos - 1] === '-') {
        e.preventDefault();
        el.setRangeText('', Math.max(0, pos - 2), pos, 'end');
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  });

  // 固定地点勾选
  document.addEventListener('click', e => {
    const tag = e.target.closest('.quick-tag');
    if (!tag) return;
    if (tag.dataset.loc) {
      const cur = $('inLocation').value.trim();
      $('inLocation').value = (cur === tag.dataset.loc) ? '' : tag.dataset.loc;
      syncLocTags();
    }
  });

  // 地点标签与输入框联动高亮
  function syncLocTags() {
    const v = $('inLocation').value.trim();
    document.querySelectorAll('#locTags .quick-tag').forEach(t => {
      t.classList.toggle('active', t.dataset.loc === v);
    });
  }
  $('inLocation').addEventListener('input', syncLocTags);

  // 地点管理
  $('btnPlaces').addEventListener('click', () => {
    editingPlaceIdx = null;
    renderPlacesList();
    $('placesMask').classList.add('show');
  });
  $('placesClose').addEventListener('click', () => $('placesMask').classList.remove('show'));
  $('placesMask').addEventListener('click', e => { if (e.target === $('placesMask')) $('placesMask').classList.remove('show'); });

  function addPlace() {
    const v = $('inNewPlace').value.trim();
    if (!v) return;
    if (places.includes(v)) { toast('这个地点已存在'); return; }
    places.push(v);
    // 如果该地点之前被删除过，从墓碑中移除（允许重新添加）
    deletedPlaces = deletedPlaces.filter(d => d.name !== v);
    $('inNewPlace').value = '';
    pushPlaces(); renderPlacesList();
    toast('已添加：' + v);
  }
  $('btnAddPlace').addEventListener('click', addPlace);
  $('inNewPlace').addEventListener('keydown', e => { if (e.key === 'Enter') addPlace(); });

  $('placesList').addEventListener('click', e => {
    const editBtn = e.target.closest('.p-edit');
    if (editBtn) { editingPlaceIdx = +editBtn.dataset.pidx; renderPlacesList(); return; }
    const saveBtn = e.target.closest('.p-save');
    if (saveBtn) { savePlaceEdit(); return; }
    const delBtn = e.target.closest('.p-del');
    if (delBtn) {
      const name = delBtn.dataset.pdel;
      places = places.filter(p => p !== name);
      // 记录墓碑，防止其他设备同步时恢复已删除的地点
      if (!deletedPlaces.find(d => d.name === name)) {
        deletedPlaces.push({ name: name, deletedAt: Date.now() });
      }
      pushPlaces(); renderPlacesList();
      toast('已删除：' + name);
    }
  });

  // 收件人标签与输入框联动高亮
  function syncRecipientTags() {
    const v = $('inRecipient').value.trim();
    document.querySelectorAll('#recipientTags .quick-tag').forEach(t => {
      t.classList.toggle('active', t.dataset.rec === v);
    });
  }
  $('inRecipient').addEventListener('input', syncRecipientTags);

  // 收件人标签点击选中
  $('recipientTags').addEventListener('click', e => {
    const t = e.target.closest('.quick-tag');
    if (!t) return;
    $('inRecipient').value = t.dataset.rec;
    syncRecipientTags();
  });

  // 收件人管理
  $('btnRecipients').addEventListener('click', () => {
    editingRecipientIdx = null;
    renderRecipientsList();
    $('recipientsMask').classList.add('show');
  });
  $('recipientsClose').addEventListener('click', () => $('recipientsMask').classList.remove('show'));
  $('recipientsMask').addEventListener('click', e => { if (e.target === $('recipientsMask')) $('recipientsMask').classList.remove('show'); });

  function renderRecipientsList() {
    $('recipientsList').innerHTML = recipients.length ? recipients.map((r, i) =>
      i === editingRecipientIdx
        ? `<div class="place-row">
             <input type="text" class="p-input" id="recipientEditInput" value="${esc(r)}" autocomplete="off">
             <button class="p-save" data-ridx="${i}" type="button">✓</button>
           </div>`
        : `<div class="place-row">
             <span class="p-name">${esc(r)}</span>
             <div class="p-ops">
               <button class="p-edit" data-ridx="${i}" type="button">✎</button>
               <button class="p-del" data-rdel="${esc(r)}" type="button">✕</button>
             </div>
           </div>`
    ).join('') : '<div class="p-empty">还没有收件人，添加一个吧～</div>';
    if (editingRecipientIdx !== null) {
      setTimeout(() => {
        const inp = $('recipientEditInput');
        if (inp) { inp.focus(); inp.select(); }
      }, 10);
    }
  }

  function addRecipient() {
    const v = $('inNewRecipient').value.trim();
    if (!v) return;
    if (recipients.includes(v)) { toast('这个收件人已存在'); return; }
    recipients.push(v);
    deletedRecipients = deletedRecipients.filter(d => d.name !== v);
    $('inNewRecipient').value = '';
    pushRecipients(); renderRecipientsList();
    toast('已添加：' + v);
  }
  $('btnAddRecipient').addEventListener('click', addRecipient);
  $('inNewRecipient').addEventListener('keydown', e => { if (e.key === 'Enter') addRecipient(); });

  function saveRecipientEdit() {
    if (editingRecipientIdx === null) return;
    const inp = $('recipientEditInput');
    const nv = inp ? inp.value.trim() : '';
    if (!nv) { toast('名称不能为空'); return; }
    const oldName = recipients[editingRecipientIdx];
    if (nv === oldName) { editingRecipientIdx = null; renderRecipientsList(); return; }
    if (recipients.includes(nv)) { toast('这个名称已存在'); return; }
    recipients[editingRecipientIdx] = nv;
    // 旧名字加入墓碑
    if (!deletedRecipients.find(d => d.name === oldName)) {
      deletedRecipients.push({ name: oldName, deletedAt: Date.now() });
    }
    // 新名字从墓碑移除（防止被误删）
    deletedRecipients = deletedRecipients.filter(d => d.name !== nv);
    // 同步更新所有记录中的收件人
    records.forEach(r => { if (r.recipient === oldName) { r.recipient = nv; touch(r); } });
    editingRecipientIdx = null;
    saveRecipientsLocal(); saveLocal();
    renderRecipientTags(); renderRecipientsList(); render();
    scheduleSync();
    toast('已修改');
  }

  $('recipientsList').addEventListener('click', e => {
    const editBtn = e.target.closest('.p-edit');
    if (editBtn) { editingRecipientIdx = +editBtn.dataset.ridx; renderRecipientsList(); return; }
    const saveBtn = e.target.closest('.p-save');
    if (saveBtn) { saveRecipientEdit(); return; }
    const delBtn = e.target.closest('.p-del');
    if (delBtn) {
      const name = delBtn.dataset.rdel;
      recipients = recipients.filter(r => r !== name);
      if (!deletedRecipients.find(d => d.name === name)) {
        deletedRecipients.push({ name: name, deletedAt: Date.now() });
      }
      pushRecipients(); renderRecipientsList();
      toast('已删除：' + name);
    }
  });

  // Tab
  function switchTab(name) {
    curTab = name;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
    render();
  }
  $('tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    switchTab(t.dataset.tab);
  });

  /* ================= 长按取件码 → 操作菜单（错误 / 删除） ================= */
  let longPressFired = false;      // 长按已弹出菜单后，抑制松手的那次单击
  let lpTimer = null, lpRecId = null, lpMoved = false;
  let actRecId = null;             // 当前操作菜单指向的记录 id

  function openActMenu(recId) {
    const rec = records.find(r => r.id === recId && !r.deleted);
    if (!rec) return;
    actRecId = recId;
    const loc = rec.location || (rec.type === 'send' ? '寄件码' : '取件码');
    $('actTitle').innerHTML = `<b>${esc(rec.code)}</b>${loc ? ' · ' + esc(loc) : ''}`;
    $('actErr').textContent = rec.errAt ? '↩ 取消错误标记' : '⚠️ 标记错误';
    $('actMask').classList.add('show');
  }
  function closeActMenu() { $('actMask').classList.remove('show'); actRecId = null; }

  // 标记错误 / 取消错误（从长按菜单触发），复用原“错误按钮”逻辑
  function actMarkErr() {
    const rec = records.find(r => r.id === actRecId && !r.deleted);
    if (!rec) { closeActMenu(); return; }
    if (rec.errAt) { delete rec.errAt; touch(rec); saveLocal(); scheduleSync(); render(); toast('已恢复为正常待取 ✓'); }
    else { rec.errAt = Date.now(); touch(rec); saveLocal(); scheduleSync(); switchTab('err'); toast('已标记错误，移入「错误」页 ⚠️'); }
    closeActMenu();
  }
  // 删除：墓碑化并同步到云端（跨设备生效）
  function actDelete() {
    const rec = records.find(r => r.id === actRecId && !r.deleted);
    closeActMenu();
    if (!rec) return;
    confirmAsk(`确认删除这一条？\n${rec.code}`, '删除', false, () => {
      rec.deleted = true; rec.deletedAt = Date.now(); touch(rec);
      saveLocal(); render(); scheduleSync();
      toast('已删除');
    });
  }
  $('actErr').addEventListener('click', actMarkErr);
  $('actDel').addEventListener('click', actDelete);
  $('actCancel').addEventListener('click', closeActMenu);
  $('actMask').addEventListener('click', e => { if (e.target === $('actMask')) closeActMenu(); });

  // 长按检测：按住约 600ms 未移动即视为长按（委托到 list，兼容触屏与鼠标）
  const LP_MS = 600, LP_MOVE = 10;
  function lpCancel() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    lpRecId = null;
  }
  function lpStart(card) {
    lpCancel();
    lpRecId = card.dataset.card; lpMoved = false;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (lpRecId) {
        longPressFired = true;       // 松手时的 click 会被拦截，避免误开编辑
        openActMenu(lpRecId);
        // 轻微触感反馈
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
      }
    }, LP_MS);
  }
  $('list').addEventListener('pointerdown', e => {
    const card = e.target.closest('.card');
    if (card && card.dataset.card) lpStart(card);
  });
  $('list').addEventListener('pointermove', e => {
    if (!lpTimer) return;
    const card = e.target.closest('.card');
    if (!card || card.dataset.card !== lpRecId) { lpCancel(); return; }
    // 移动超阈值则视为滚动，取消长按
    if (e.pointerType !== 'mouse' && e.movementX * e.movementX + e.movementY * e.movementY > LP_MOVE * LP_MOVE) {
      lpMoved = true; lpCancel();
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
    $('list').addEventListener(ev, () => { lpCancel(); });
  });

  // 列表操作（事件委托）
  $('list').addEventListener('click', e => {
    // 长按刚弹出过菜单的这一次 click（松手触发）不再作为单击处理，避免误打开编辑
    if (longPressFired) { longPressFired = false; return; }
    // 错误页内"恢复"按钮：取消标记，回到正常待取
    const undo = e.target.closest('[data-err-undo]');
    if (undo) {
      e.stopPropagation();
      const rec = records.find(r => r.id === undo.dataset.errUndo && !r.deleted);
      if (rec) {
        delete rec.errAt;
        touch(rec);
        saveLocal(); scheduleSync();
        render();
        toast('已恢复为正常待取 ✓');
      }
      return;
    }
    // 分组头：展开 / 收起
    const ghead = e.target.closest('.group-head');
    if (ghead) {
      const name = ghead.dataset.group;
      if (expandedGroups.has(name)) expandedGroups.delete(name);
      else expandedGroups.add(name);
      render();
      return;
    }
    const btn = e.target.closest('button');
    if (!btn) {
      // 点击卡片主体（单号区域）→ 打开编辑，可修改存放地点等
      const card = e.target.closest('.card');
      if (card && card.dataset.card) {
        const rec = records.find(r => r.id === card.dataset.card && !r.deleted);
        if (rec) openForm(rec);
      }
      return;
    }
    const id = btn.dataset.toggle;
    const rec = records.find(r => r.id === id && !r.deleted);
    if (!rec || rec.errAt) return;

    if (btn.dataset.toggle) {
      rec.takenAt = rec.takenAt ? null : Date.now();
      touch(rec);
      saveLocal(); render(); scheduleSync();
      const isSend = rec.type === 'send';
      toast(rec.takenAt
        ? (isSend ? '已收走 ✓' : '已标记取件 ✓')
        : (isSend ? '已恢复待收' : '已恢复待取'));
    }
  });

  // 大字取件
  function showBig(rec) {
    $('bCompany').textContent = rec.recipient || '取件码';
    $('bCode').textContent = rec.code;
    $('bLoc').textContent = rec.location ? '📍 ' + rec.location : '';
    $('bigMask').classList.add('show');
  }
  $('bigMask').addEventListener('click', () => $('bigMask').classList.remove('show'));
  $('bigClose').addEventListener('click', e => { e.stopPropagation(); $('bigMask').classList.remove('show'); });

  // 确认框按钮
  $('confirmCancel').addEventListener('click', closeConfirm);
  $('confirmMask').addEventListener('click', e => { if (e.target === $('confirmMask')) closeConfirm(); });
  $('confirmOk').addEventListener('click', () => { if (confirmAction) confirmAction(); closeConfirm(); });

  // 工具面板
  $('btnTools').addEventListener('click', () => {
    const p = $('toolPanel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  });

  // 导出（仅有效记录，不含墓碑）
  $('btnExport').addEventListener('click', () => {
    const vis = visRecords();
    if (!vis.length) { toast('还没有记录可导出'); return; }
    const blob = new Blob([JSON.stringify(vis, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    a.download = `取件码备份_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('备份文件已生成 📤');
  });

  // 导入（记录级合并）
  $('btnImport').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw 0;
        const valid = data.filter(x => x && x.code).map(x => ({
          ...x, id: x.id || uid(), updatedAt: x.updatedAt || Date.now()
        }));
        if (!valid.length) throw 0;
        confirmAsk(`导入 ${valid.length} 条记录？将与现有记录合并`, '导入', true, () => {
          records = mergeRecords(records, valid);
          saveLocal(); render(); scheduleSync();
          toast('导入完成，已同步到云端 ✓');
        });
      } catch (err) { toast('文件格式不对，导入失败'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // 清空已完成（含已取件+已收走的寄件码，墓碑化并同步到其他设备）
  $('btnClearDone').addEventListener('click', () => {
    const doneList = visRecords().filter(r => r.takenAt);
    if (!doneList.length) { toast('没有已完成的记录'); return; }
    confirmAsk(`清空 ${doneList.length} 条已完成记录？清空后无法恢复`, '清空', false, () => {
      const now = Date.now();
      const doneIds = new Set(doneList.map(r => r.id));
      records = records.map(r => doneIds.has(r.id)
        ? { id: r.id, deleted: true, deletedAt: now, updatedAt: now }
        : r);
      saveLocal(); render(); scheduleSync();
      toast('已清空已完成记录 🧹');
    });
  });

  // 同步胶囊：点击手动同步
  $('syncChip').addEventListener('click', () => {
    if (!ghConfig.token || ghConfig.mode === 'local') { toast('本地模式：数据仅保存在本机浏览器，点击 ☁️ 云同步设置 配置 GitHub'); return; }
    syncNow(true);
  });

  // GitHub 设置
  $('btnSettings').addEventListener('click', () => {
    $('ghToken').value = ghConfig.token || '';
    $('ghOwner').value = ghConfig.owner || '';
    $('ghRepo').value = ghConfig.repo || '';
    $('ghBranch').value = ghConfig.branch || '';
    $('ghDataFile').value = ghConfig.dataFile || '';
    document.getElementById('modeCloud').classList.toggle('active', ghConfig.mode !== 'local');
    document.getElementById('modeLocal').classList.toggle('active', ghConfig.mode === 'local');
    $('ghMask').classList.add('show');
  });
  $('ghClose').addEventListener('click', () => $('ghMask').classList.remove('show'));
  $('ghMask').addEventListener('click', e => { if (e.target === $('ghMask')) $('ghMask').classList.remove('show'); });
  document.getElementById('modeCloud').addEventListener('click', () => {
    ghConfig.mode = 'cloud'; saveGHConfig();
    document.getElementById('modeCloud').classList.add('active');
    document.getElementById('modeLocal').classList.remove('active');
  });
  document.getElementById('modeLocal').addEventListener('click', () => {
    ghConfig.mode = 'local'; saveGHConfig();
    document.getElementById('modeLocal').classList.add('active');
    document.getElementById('modeCloud').classList.remove('active');
    setSyncStatus('local');
  });
  $('ghSave').addEventListener('click', () => {
    ghConfig.token = $('ghToken').value.trim();
    ghConfig.owner = $('ghOwner').value.trim() || 'xwfpl';
    ghConfig.repo = $('ghRepo').value.trim() || 'xwfpl.github.io';
    ghConfig.branch = $('ghBranch').value.trim() || 'main';
    ghConfig.dataFile = $('ghDataFile').value.trim() || 'pickup-data.json';
    saveGHConfig();
    $('ghMask').classList.remove('show');
    toast('配置已保存，正在连接…');
    syncNow(true);
  });

  // 手动同步按钮
  $('btnSync').addEventListener('click', () => {
    if (!ghConfig.token || ghConfig.mode === 'local') { toast('请先配置 GitHub 云同步'); return; }
    syncNow(true);
  });

  /* ================= 初始化 ================= */
  renderLocTags();
  renderRecipientTags();
  render();
  if (ghConfig.token && ghConfig.mode !== 'local') {
    setSyncStatus('busy');
    syncNow(false);
    setInterval(() => { syncNow(false); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncNow(false); } });
    window.addEventListener('online', () => { syncNow(false); });
  } else {
    setSyncStatus('local');
  }
})();
</script>
</body>
</html>
