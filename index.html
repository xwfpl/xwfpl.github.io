    font-size: 56px;

  .empty-state p {
    font-size: 14px;
    color: var(--ink);

  }

  .empty-state .empty-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ===== Lightbox ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(50, 20, 40, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .lightbox.active { display: flex; }

  .lightbox img {
    max-width: 90%;
    max-height: 88vh;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .lightbox-close:hover {
    background: var(--accent);
    transform: scale(1.1);
  }

  /* ===== Modal (编辑) ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(50, 20, 40, 0.4);
    backdrop-filter: blur(4px);
    z-index: 900;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;

  .modal {
    background: linear-gradient(180deg, white, #fff5f7);
    border: 1px solid var(--rule);
    border-radius: var(--radius-xl);
    padding: 24px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: modalPop 0.3s ease;

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }

  .modal h3 {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-dark);
    margin-bottom: 16px;

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 2000;
    padding: 12px 20px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    transform: translateX(420px);

    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toast.show { transform: translateX(0); }
  .toast.success { background: linear-gradient(135deg, #7ed6a7, #5bc892); color: white; }
  .toast.error { background: linear-gradient(135deg, #ff8fa3, #ff6b9d); color: white; }

  /* ===== Sync Indicator ===== */
  .sync-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 8px;
    margin-bottom: 6px;
    width: 100%;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }

  .sync-indicator:hover {
    background: var(--accent-soft);
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c9a8bc;
    flex-shrink: 0;
    transition: all 0.3s ease;
    position: relative;
  }

  .sync-dot.syncing {
    background: #ffc86b;
    animation: syncPulse 1s ease-in-out infinite;
  }

  .sync-dot.synced {
    background: #7ed6a7;
    box-shadow: 0 0 6px rgba(126, 214, 167, 0.5);
  }

  .sync-dot.error {
    background: #ff8fa3;
  }

  @keyframes syncPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  .sync-text {

<script>
// ===== GitHub Config (loaded from localStorage) =====
const GITHUB_CONFIG_KEY = 'collection-workbench-github-config';
let GITHUB_CONFIG = {
  owner: 'xwfpl',
  repo: 'xwfpl.github.io',
  branch: 'main',
  token: '',
  dataFile: 'data.json'
};

function loadGitHubConfig() {
  try {
    const saved = localStorage.getItem(GITHUB_CONFIG_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      GITHUB_CONFIG = { ...GITHUB_CONFIG, ...parsed };
    }
  } catch (e) {}
}

function saveGitHubConfig() {
  localStorage.setItem(GITHUB_CONFIG_KEY, JSON.stringify(GITHUB_CONFIG));
}

function isGitHubConfigured() {
  return GITHUB_CONFIG.token && GITHUB_CONFIG.token.length > 0;
}

// ===== State =====
const STORAGE_KEY = 'collection-workbench-entries';
const GITHUB_SHA_KEY = 'collection-workbench-github-sha';
let state = { entries: [] };
let currentTab = 'overview';
let searchFilter = '';
let newPhotos = [];
let editingId = null;
let editPhotos = [];
let githubSha = null;
let syncTimer = null;
let isInitialized = false;

// ===== Init =====
async function init() {
  loadGitHubConfig();
  loadStateLocal();
  renderAll();
  setupEventListeners();
  if (isGitHubConfigured()) {
    setSyncStatus('syncing', '连接中...');
    await loadFromGitHub();
    renderAll();
  } else {
    setSyncStatus('error', '未配置');
    setTimeout(() => openSettingsModal(), 500);
  }
  isInitialized = true;
}

// ===== Local Storage =====
function loadStateLocal() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = JSON.parse(saved);
    const savedSha = localStorage.getItem(GITHUB_SHA_KEY);
    if (savedSha) githubSha = savedSha;
  } catch (e) { console.error('Local load failed:', e); }
}

function saveStateLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast('本地存储空间不足', 'error');
  }
}

// ===== Base64 Helpers (UTF-8 safe) =====
function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function base64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
}

// ===== GitHub API =====
async function githubGetFile(path) {
  const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}?ref=${GITHUB_CONFIG.branch}`;
  const res = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
      'Accept': 'application/vnd.github+json'
    }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
  return await res.json();
}

async function githubPutFile(path, content, message, sha) {
  const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`;
  const body = {
    message: message,
    content: utf8ToBase64(content),
    branch: GITHUB_CONFIG.branch
  };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API: ${res.status}`);
  }
  return await res.json();
}

async function loadFromGitHub() {
  setSyncStatus('syncing', '同步中...');
  try {
    const file = await githubGetFile(GITHUB_CONFIG.dataFile);
    if (!file) {
      // No data on GitHub yet, push local data
      if (state.entries.length > 0) {
        await saveToGitHub();
      } else {
        setSyncStatus('synced', '已同步');
      }
      return;
    }

    githubSha = file.sha;
    localStorage.setItem(GITHUB_SHA_KEY, githubSha);

    const content = base64ToUtf8(file.content);
    const remoteState = JSON.parse(content);

    // Use remote data if it has more entries or if local is empty
    if (remoteState.entries.length >= state.entries.length) {
      state = remoteState;
      saveStateLocal();
      renderAll();
    } else if (isInitialized) {
      // Local has more data, push to GitHub
      await saveToGitHub();
    }

    setSyncStatus('synced', '已同步');
  } catch (e) {
    console.error('GitHub load failed:', e);
    setSyncStatus('error', '同步失败');
    showToast('加载失败: ' + e.message, 'error');
  }
}

async function saveToGitHub() {
  setSyncStatus('syncing', '上传中...');
  try {
    const result = await githubPutFile(
      GITHUB_CONFIG.dataFile,
      JSON.stringify(state),
      `Update: ${new Date().toLocaleString('zh-CN')}`,
      githubSha
    );
    githubSha = result.content.sha;
    localStorage.setItem(GITHUB_SHA_KEY, githubSha);
    setSyncStatus('synced', '已同步');
    return true;
  } catch (e) {
    console.error('GitHub save failed:', e);
    setSyncStatus('error', '同步失败');
    showToast('云同步失败，数据已保存在本地', 'error');
    return false;
  }
}

function debouncedSyncToGitHub() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => saveToGitHub(), 2000);
}

// ===== Sync Status =====
function setSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (dot) {
    dot.className = 'sync-dot ' + status;
  }
  if (txt) {
    txt.textContent = text;
  }
}

// ===== Tab Switching =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(item => {
    item.classList.toggle('active', item.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.toggle('active', content.id === `tab-${tab}`);
  });
  if (tab === 'overview') renderRecent();
}

function scrollToForm() {
  document.getElementById('entry-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ===== Events =====
function setupEventListeners() {
  document.getElementById('entry-search').addEventListener('input', (e) => {
    searchFilter = e.target.value.toLowerCase();
    renderEntries();
  });

  const uploadZone = document.getElementById('upload-zone');
  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    addNewPhotos(files);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeLightbox(); closeEditModal(); }
  });
}

// ===== Photo Handling =====
function handlePhotoUpload(e) {
  addNewPhotos(Array.from(e.target.files));
  e.target.value = '';
}

function addNewPhotos(files) {
  const imageFiles = files.filter(f => f.type.startsWith('image/'));
  if (imageFiles.length === 0) return;

  imageFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      compressImage(e.target.result, 1200, 0.85).then(compressed => {
        newPhotos.push({
          id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
          dataUrl: compressed,
          name: file.name
        });
        renderPreview();
      });
    };
    reader.readAsDataURL(file);
  });
}

function renderPreview() {
  const row = document.getElementById('preview-row');
  if (newPhotos.length === 0) { row.innerHTML = ''; return; }
  row.innerHTML = newPhotos.map((p, i) => `
    <div class="preview-item">
      <img src="${p.dataUrl}" alt="${escapeHtml(p.name)}">
      <button class="remove-btn" onclick="removeNewPhoto(${i})">✕</button>
    </div>
  `).join('');
}

function removeNewPhoto(index) {
  newPhotos.splice(index, 1);
  renderPreview();
}

function compressImage(dataUrl, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      if (img.width <= maxWidth) { resolve(dataUrl); return; }
      const canvas = document.createElement('canvas');
      const ratio = maxWidth / img.width;
      canvas.width = maxWidth;
      canvas.height = img.height * ratio;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

// ===== Entry CRUD =====
function saveEntry() {
  const title = document.getElementById('entry-title').value.trim();
  const content = document.getElementById('entry-content').value.trim();

  if (!title && !content && newPhotos.length === 0) {
    showToast('写点什么或加张图片吧～', 'error');
    return;
  }

  const entry = {
    id: Date.now().toString(),
    title: title || '未命名收集',
    content: content,
    photos: newPhotos.map(p => ({ id: p.id, dataUrl: p.dataUrl, name: p.name })),
    createdAt: new Date().toISOString()
  };

  state.entries.unshift(entry);
  saveStateLocal();
  debouncedSyncToGitHub();
  renderAll();
  clearForm();
  showToast('保存成功啦 ♡', 'success');
}

function clearForm() {
  document.getElementById('entry-title').value = '';
  document.getElementById('entry-content').value = '';
  newPhotos = [];
  renderPreview();
}

function deleteEntry(id) {
  if (!confirm('确定要删除这条收集吗？')) return;
  state.entries = state.entries.filter(e => e.id !== id);
  saveStateLocal();
  debouncedSyncToGitHub();
  renderAll();
  showToast('已删除', 'success');
}

// ===== Edit =====
function openEditModal(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  editingId = id;
  editPhotos = entry.photos.map(p => ({ ...p }));

  document.getElementById('edit-title').value = entry.title;
  document.getElementById('edit-content').value = entry.content;
  renderEditPreview();
  document.getElementById('edit-modal').classList.add('active');
}

function closeEditModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('edit-modal').classList.remove('active');
  editingId = null;
  editPhotos = [];
}

function handleEditPhotoUpload(e) {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      compressImage(ev.target.result, 1200, 0.85).then(compressed => {
        editPhotos.push({
          id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
          dataUrl: compressed,
          name: file.name
        });
        renderEditPreview();
      });
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function renderEditPreview() {
  const row = document.getElementById('edit-preview');
  if (editPhotos.length === 0) { row.innerHTML = '<span style="font-size:12px;color:var(--muted);">暂无图片</span>'; return; }
  row.innerHTML = editPhotos.map((p, i) => `
    <div class="preview-item">
      <img src="${p.dataUrl}" alt="${escapeHtml(p.name)}">
      <button class="remove-btn" onclick="removeEditPhoto(${i})">✕</button>
    </div>
  `).join('');
}

function removeEditPhoto(index) {
  editPhotos.splice(index, 1);
  renderEditPreview();
}

function saveEdit() {
  if (!editingId) return;
  const entry = state.entries.find(e => e.id === editingId);
  if (!entry) return;

  entry.title = document.getElementById('edit-title').value.trim() || '未命名收集';
  entry.content = document.getElementById('edit-content').value.trim();
  entry.photos = editPhotos.map(p => ({ id: p.id, dataUrl: p.dataUrl, name: p.name }));
  entry.updatedAt = new Date().toISOString();

  saveStateLocal();
  debouncedSyncToGitHub();
  renderAll();
  closeEditModal();
  showToast('修改已保存 ♡', 'success');
}

// ===== Lightbox =====
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e && e.target.tagName === 'IMG') return;
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

// ===== Render =====
function renderEntries() {
  const list = document.getElementById('entries-list');
  const filtered = state.entries.filter(e =>
    !searchFilter ||
    e.title.toLowerCase().includes(searchFilter) ||
    e.content.toLowerCase().includes(searchFilter)
  );

  document.getElementById('entry-badge').textContent = state.entries.length;

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📓</div>
        <p>${searchFilter ? '没找到相关的收集呢' : '还没有收集条目'}</p>
        <p class="empty-hint">${searchFilter ? '试试别的关键词吧' : '在上面创建你的第一条收集吧～'}</p>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(e => renderEntryCard(e)).join('');
}

function renderEntryCard(entry) {
  const displayPhotos = entry.photos.slice(0, 4);
  const remaining = entry.photos.length - 4;

  return `
    <div class="entry-card">
      <div class="entry-card-header">
        <div class="entry-card-title">
          <h3>${escapeHtml(entry.title)}</h3>
          <div class="entry-date">
            <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            ${formatDate(entry.createdAt)}
            ${entry.photos.length > 0 ? ` · ${entry.photos.length} 张图片` : ''}
          </div>
        </div>
        <div class="entry-actions">
          <button onclick="openEditModal('${entry.id}')">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            编辑
          </button>
          <button class="del" onclick="deleteEntry('${entry.id}')">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            删除
          </button>
        </div>
      </div>
      <div class="entry-card-body">
        ${entry.content ? `<div class="entry-text">${escapeHtml(entry.content)}</div>` : ''}
        ${entry.photos.length > 0 ? `
          <div class="entry-photos">
            ${displayPhotos.map(p => `
              <div class="entry-photo" onclick="openLightbox('${p.dataUrl}')">
                <img src="${p.dataUrl}" alt="${escapeHtml(p.name)}" loading="lazy">
              </div>
            `).join('')}
            ${remaining > 0 ? `
              <div class="entry-photo more">+${remaining}</div>
            ` : ''}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderRecent() {
  const container = document.getElementById('recent-entries');
  const recent = state.entries.slice(0, 3);

  if (recent.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1; padding: 30px 20px;">
        <div class="empty-icon" style="font-size: 40px;">📓</div>
        <p style="font-size: 13px;">还没有收集条目</p>
      </div>
    `;
    return;
  }

  container.innerHTML = recent.map(e => `
    <div class="recent-entry" onclick="switchTab('entries')">
      <div class="re-img">
        ${e.photos.length > 0
          ? `<img src="${e.photos[0].dataUrl}" alt="">`
          : `<span class="re-placeholder">无图片</span>`
        }
      </div>
      <div class="re-title">${escapeHtml(e.title)}</div>
      <div class="re-text">${escapeHtml(e.content || '无文字描述')}</div>
      <div class="re-time">${formatDateShort(e.createdAt)} · ${e.photos.length} 图</div>
    </div>
  `).join('');
}

// ===== Data Import/Export =====
function exportAllData() {
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `我的收集_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功啦 ♡', 'success');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const data = JSON.parse(event.target.result);
      const entries = data.entries || [];
      if (entries.length === 0 && !data.texts && !data.photos) {
        showToast('这个文件好像不对呢', 'error');
        return;
      }
      let importCount = entries.length;
      if (data.texts || data.photos) {
        const oldEntry = {
          id: Date.now().toString() + '_legacy',
          title: '旧数据导入',
          content: (data.texts || []).map(t => t.content).join('\n\n---\n\n'),
          photos: (data.photos || []).map(p => ({ id: p.id, dataUrl: p.dataUrl, name: p.name })),
          createdAt: new Date().toISOString()
        };
        if (oldEntry.content || oldEntry.photos.length > 0) {
          state.entries.unshift(oldEntry);
          importCount = 1;
        }
      } else {
        state.entries = [...entries, ...state.entries];
      }
      if (confirm(`要导入 ${importCount} 条收集吗？`)) {
        if (entries.length > 0) state.entries = [...entries, ...state.entries];
        saveStateLocal();
        debouncedSyncToGitHub();
        renderAll();
        showToast('导入成功啦 ♡', 'success');
      }
    } catch (err) {
      showToast('文件解析失败了', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===== Manual Sync =====
async function manualSync() {
  if (!isGitHubConfigured()) {
    openSettingsModal();
    return;
  }
  showToast('正在同步...', 'success');
  await saveToGitHub();
  await loadFromGitHub();
  renderAll();
  if (document.getElementById('sync-dot').classList.contains('synced')) {
    showToast('同步成功 ♡', 'success');
  }
}

// ===== Settings Modal =====
function openSettingsModal() {
  document.getElementById('settings-token').value = GITHUB_CONFIG.token || '';
  document.getElementById('settings-owner').value = GITHUB_CONFIG.owner || '';
  document.getElementById('settings-repo').value = GITHUB_CONFIG.repo || '';
  document.getElementById('settings-branch').value = GITHUB_CONFIG.branch || 'main';
  document.getElementById('settings-datafile').value = GITHUB_CONFIG.dataFile || 'data.json';
  document.getElementById('settings-modal').classList.add('active');
}

function closeSettingsModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('settings-modal').classList.remove('active');
}

async function saveSettings() {
  GITHUB_CONFIG.token = document.getElementById('settings-token').value.trim();
  GITHUB_CONFIG.owner = document.getElementById('settings-owner').value.trim();
  GITHUB_CONFIG.repo = document.getElementById('settings-repo').value.trim();
  GITHUB_CONFIG.branch = document.getElementById('settings-branch').value.trim() || 'main';
  GITHUB_CONFIG.dataFile = document.getElementById('settings-datafile').value.trim() || 'data.json';
  saveGitHubConfig();
  closeSettingsModal();
  setSyncStatus('syncing', '连接中...');
  await loadFromGitHub();
  renderAll();
  const dot = document.getElementById('sync-dot');
  if (dot && dot.classList.contains('synced')) {
    showToast('连接成功 ♡', 'success');
  }
}

// ===== Utils =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const diff = now - date;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
  if (diff < 604800000) return `${Math.floor(diff / 86400000)} 天前`;
  return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatDateShort(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const diff = now - date;
  if (diff < 86400000) return '今天';
  if (diff < 172800000) return '昨天';
  return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = (type === 'success' ? '♡ ' : '• ') + message;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function renderAll() {
  renderEntries();
  renderRecent();
}

document.addEventListener('DOMContentLoaded', init);
</script>
