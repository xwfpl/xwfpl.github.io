<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>暖记 · 台</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  input,textarea,[contenteditable="true"]{
    -webkit-touch-callout:default;-webkit-user-select:text;user-select:text;}
  html{background:#f2f0ed !important;min-height:100%;}
  :root{
    --bg:#f5f4f2; --card:#fff; --text:#2c2a28; --soft:#9a9498; --light:#b8b2b8;
    --accent:#d46a8a; --accent-soft:#fce9f0;
    --pink:#fce9f0; --pink-deep:#e896a8;
    --border:#e8e4e2; --border-light:#f0ede9;
    --radius:14px; --radius-sm:8px;
    --shadow:none;
    --font:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;
    /* Group color themes - 粉 绿 蓝 紫 金（浅色系） */
    --c1-bg:#fef5f3; --c1-deep:#e89a96; --c1-bar:#f0b4ae;
    --c2-bg:#f2f7ee; --c2-deep:#9cc490; --c2-bar:#b8d8ac;
    --c3-bg:#f0f4fa; --c3-deep:#9ab4d8; --c3-bar:#b2c8e2;
    --c4-bg:#f6f2f7; --c4-deep:#bda0c4; --c4-bar:#cdb8d4;
    --c5-bg:#faf6ea; --c5-deep:#dcb878; --c5-bar:#e8cc96;
  }

  body{
    font-family:var(--font);
    background:#f2f0ed !important; color:var(--text);
    min-height:100vh; -webkit-font-smoothing:antialiased;
    padding:20px 0 0;
  }

  .wrap{max-width:580px;margin:0 auto;padding:0 16px 40px;}

  /* Top bar */
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{
    font-size:22px;line-height:1;
    color:#e8a098;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.5px;}
  .header-actions{display:flex;gap:6px;}
  .btn{
    border:none;border-radius:var(--radius-sm);
    padding:6px 12px;font-size:12px;font-weight:600;
    cursor:pointer;transition:all .2s;font-family:var(--font);
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .btn-pink{background:#f8b4c4;color:#333;transition:all .12s;}
  .btn-pink:hover{filter:brightness(1.05);}
  .btn-pink:active{filter:brightness(.95);}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--soft);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  /* Swipe-to-delete wrapper */
  .swipe-wrap{
    position:relative;overflow:hidden;margin-bottom:12px;
  }
  .swipe-bg{
    position:absolute;inset:0;
    background:linear-gradient(135deg,#fce8e6,#f8d0d0);
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:20px;color:#e8857d;font-size:13px;font-weight:700;
    border-radius:var(--radius);
  }
  .swipe-content{
    position:relative;z-index:2;
    transition:transform .25s ease;
    background:transparent;
  }
  .swipe-content.swiped{transform:translateX(-70px);}

  /* Group card — title + data together */
  .group{
    background:var(--card);border:2px solid var(--gbar,var(--c1-bar));
    border-radius:var(--radius);
    overflow:hidden;
  }

  /* Card header = title row, clickable to collapse */
  .grp-head{
    display:flex;align-items:center;gap:8px;
    padding:12px 8px 12px 16px;cursor:pointer;
    background:var(--ghead-bg,var(--c1-bg));
    border-bottom:1px solid var(--border);
    user-select:none;
  }
  .grp-head.collapsed .grp-arrow{transform:rotate(-90deg);}
  .grp-head.collapsed{border-bottom:none;}
  .grp-title{
    flex:0 1 auto;font-size:17px;font-weight:700;color:var(--text);
    border:none;background:transparent;outline:none;font-family:var(--font);
    padding:2px 4px;border-radius:0;min-width:0;
    transition:all .2s;
  }
  .grp-title.locked{cursor:pointer;}
  .grp-title.unlocked{border-bottom:1.5px solid var(--gdeep,var(--c1-deep));background:rgba(255,255,255,.6);border-radius:4px;cursor:text;}
  .grp-title::placeholder{color:#b8b2b8;font-weight:500;font-size:14px;}
  .grp-status-txt{
    flex:0 0 auto;font-size:13px;font-weight:700;color:var(--gdeep,var(--c1-deep));
    padding:2px 4px;white-space:nowrap;user-select:none;
    margin-left:auto;
  }
  .grp-spacer{flex:0 0 6px;}
  .grp-date{
    font-size:14px;color:var(--gdeep,var(--c1-deep));font-weight:700;flex-shrink:0;
    background:transparent;border:none;outline:none;font-family:var(--font);
    width:82px;padding:2px 4px;text-align:right;cursor:pointer;
    transition:all .2s;margin-right:2px;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .grp-date:hover{opacity:.7;}
  .grp-sum-mini{
    font-size:16px;font-weight:800;color:var(--text);
    font-variant-numeric:tabular-nums;flex-shrink:0;min-width:24px;text-align:right;
    margin-right:2px;
  }
  .grp-del{
    border:none;background:transparent;color:#c8c2c6;
    font-size:14px;cursor:pointer;
    width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;flex-shrink:0;
  }
  .grp-del:hover{background:#fce8e6;color:#e8857d;}

  /* Collapsible body */
  .grp-body{
    max-height:2000px;overflow:hidden;
    transition:max-height .3s ease;
  }
  .grp-body.collapsed{max-height:0;}

  /* Rows */
  .row{
    display:grid;
    grid-template-columns:14px 1fr 6px 30px 6px 40px 6px 42px 6px 22px;
    gap:4px;align-items:center;
    padding:9px 8px 9px 10px;
    border-bottom:1px solid var(--border-light);
    transition:background .15s;font-size:14px;
  }
  .row:hover{background:#faf9f6;}
  .row-head{
    display:grid;
    grid-template-columns:14px 1fr 6px 30px 6px 40px 6px 42px 6px 22px;
    gap:4px;align-items:center;
    padding:6px 8px 6px 10px;
    border-bottom:1.5px solid var(--border);
    font-size:11px;font-weight:600;color:var(--soft);
    background:var(--ghead-bg,var(--c1-bg));
  }
  .rh-num{grid-column:1;text-align:right;}
  .rh-name{grid-column:2;}
  .rh-sep1{grid-column:3;}
  .rh-qty{grid-column:4;text-align:center;}
  .rh-sep2{grid-column:5;}
  .rh-price{grid-column:6;text-align:center;}
  .rh-sep3{grid-column:7;}
  .rh-total{grid-column:8;text-align:center;}
  .rh-sep4{grid-column:9;}
  .rh-del{grid-column:10;}
  .col-sep{color:var(--soft);font-size:11px;font-weight:600;text-align:center;user-select:none;}
  .row-num{font-size:12px;color:#c8c2c6;font-weight:600;grid-column:1;flex-shrink:0;text-align:right;}
  .inp{
    border:none;border-bottom:1.5px dashed #d8d4d2;
    background:transparent;padding:3px 2px;font-size:14px;
    color:var(--text);outline:none;font-family:var(--font);
    transition:all .2s;border-radius:0;
  }
  .inp:focus{border-bottom:1.5px solid #f8b4c4;border-bottom-style:solid;}
  .inp::placeholder{color:#cdc8c3;font-size:13px;}
  .inp-name{width:100%;min-width:0;font-size:15px;font-weight:600;}
  .inp-num{width:100%;text-align:center;font-size:16px;font-weight:600;}
  .inp-price{width:100%;text-align:center;font-size:16px;font-weight:600;}
  /* 去掉数字输入框的上下微调按钮（桌面浏览器） */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0;
  }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .sep{color:var(--soft);font-size:12px;flex-shrink:0;user-select:none;margin:0 -1px;}
  .eq{color:var(--soft);font-size:12px;flex-shrink:0;}
  .total{font-size:16px;font-weight:700;color:var(--text);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .row .total{font-size:16px;text-align:center;}
  .del{
    border:none;background:transparent;color:#d5d0cc;
    font-size:13px;cursor:pointer;width:22px;height:22px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;flex-shrink:0;justify-self:end;
  }
  .del:hover{background:#fce8e6;color:#e8857d;}
  .grp-restore{
    background:transparent;border:1px solid var(--border);color:var(--soft);
    padding:5px 10px;font-size:11px;font-weight:600;
    border-radius:var(--radius-sm);cursor:pointer;
    font-family:var(--font);transition:all .2s;
  }
  .grp-restore:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  .add-row{
    display:flex;align-items:center;justify-content:center;
    padding:8px;cursor:pointer;color:var(--soft);
    font-size:12px;font-weight:600;transition:all .2s;
    border-top:1px dashed var(--border);
  }
  .add-row:hover{color:var(--accent);background:var(--accent-soft);}

  /* Footer */
  .grp-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    background:linear-gradient(135deg,var(--ghead-bg,var(--c1-bg)),#fff);
    border-top:1px solid var(--border);
    font-size:13px;
  }
  .grp-sum{color:var(--soft);font-weight:500;}
  .grp-sum .n{color:var(--gdeep,var(--c1-deep));font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;}
  .grp-sum-total{font-size:15px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .grp-copy{
    background:#b8d4e8;color:#333;border:none;
    padding:6px 14px;font-size:11px;font-weight:700;
    border-radius:var(--radius-sm);cursor:pointer;
    font-family:var(--font);transition:filter .12s;
  }
  .grp-copy:hover{filter:brightness(1.02);}
  .grp-copy:active{filter:brightness(.92);}
  .grp-arrow{
    font-size:11px;color:var(--gdeep,var(--c1-deep));transition:transform .25s ease;
    flex-shrink:0;font-weight:700;
  }

  /* Photo upload at bottom */
  .grp-photos{
    padding:8px 0 10px;border-top:1px solid var(--border-light);background:#faf8f5;
  }
  .photo-upload-zone{
    width:36px;height:36px;border-radius:50%;
    background:#f8b4c4;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;overflow:hidden;
    transition:filter .15s;
  }
  .photo-upload-zone:hover{filter:brightness(1.05);}
  .photo-upload-zone input[type="file"]{
    position:absolute;inset:0;opacity:0;cursor:pointer;
    width:100%;height:100%;
  }
  .photo-upload-zone::before{
    content:"";width:14px;height:11px;border:1.5px solid #fff;
    border-radius:2px;position:relative;
  }
  .photo-upload-zone::after{
    content:"";width:4px;height:4px;border-radius:50%;
    background:#fff;position:absolute;
    top:12px;right:12px;
  }
  .photo-grid-mini{
    display:grid;grid-template-columns:repeat(auto-fill,40px);
    gap:5px;margin-top:8px;padding:0 12px;justify-content:start;
  }
  /* 默认只显示两行，超出折叠，避免母表被图片撑得过长 */
  .photo-grid-mini.grid-closed{
    max-height:85px;overflow:hidden;position:relative;
  }
  .grid-more-btn{
    display:block;width:100%;margin-top:4px;padding:5px 0;
    background:transparent;border:none;cursor:pointer;
    font-size:12px;font-weight:600;color:var(--soft);
    font-family:var(--font);
  }
  .grid-more-btn:active{color:var(--accent);}
  .pgm-item{
    position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;
    border:1px solid var(--border);
  }
  .pgm-item img{width:100%;height:100%;object-fit:cover;cursor:pointer;}
  .pgm-item .rm{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.5);color:#fff;border:none;
    cursor:pointer;font-size:10px;
    display:flex;align-items:center;justify-content:center;
  }

  /* Image viewer / lightbox */
  .img-viewer{
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,.85);
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  .img-viewer.show{display:flex;}
  .img-viewer img{
    max-width:100%;max-height:100%;border-radius:8px;
    object-fit:contain;
  }
  .img-viewer-close{
    position:fixed;top:16px;right:16px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.2);color:#fff;border:none;
    font-size:20px;cursor:pointer;z-index:10000;
    display:flex;align-items:center;justify-content:center;
  }

  /* New group */
  .new-group{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:14px;cursor:pointer;color:#333;
    font-size:13px;font-weight:700;transition:filter .12s;
    border:none;border-radius:var(--radius);
    background:#d4b8e0;
    flex:1;
  }
  .new-group:hover{filter:brightness(1.02);}
  .new-group:active{filter:brightness(.92);}
  .bottom-actions{display:flex;gap:8px;align-items:stretch;}
  .grp-restore-btn{
    padding:14px 18px;cursor:pointer;color:var(--soft);
    font-size:13px;font-weight:600;transition:all .2s;
    border:2px solid var(--border);border-radius:var(--radius);
    background:transparent;white-space:nowrap;
  }
  .grp-restore-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

  /* Sub-boxes - numbered buttons */
  .photo-box-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 12px 8px;}
  .photo-box-row .photo-upload-zone{margin:0;cursor:pointer;}
  .box-num{
    display:inline-flex;align-items:center;justify-content:center;gap:2px;
    width:36px;height:36px;border-radius:9px;font-size:14px;font-weight:700;
    color:#333;cursor:pointer;
    transition:all .12s;position:relative;flex-shrink:0;
  }
  .box-num:hover{filter:brightness(1.02);}
  .box-num:active{filter:brightness(.95);}
  /* 马卡龙色 - 6种循环，纯色 */
  .bn-0{background:#f8b4c4;}
  .bn-1{background:#d4b8e0;}
  .bn-2{background:#b8d4e8;}
  .bn-3{background:#b8e0c8;}
  .bn-4{background:#f0d080;}
  .bn-5{background:#f8b8d0;}
  .box-num-add{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:9px;font-size:17px;font-weight:700;
    color:#f8b4c4;background:#fff;border:2px dashed #f8d0d8;
    cursor:pointer;transition:all .12s;flex-shrink:0;
  }
  .box-num-add:hover{color:#fff;border-color:#f8b4c4;background:#f8b4c4;}

  /* Status tag - 纯色填充 */
  .status-tag{
    margin-left:auto;flex-shrink:0;
    padding:10px 22px;border-radius:16px;font-size:14px;font-weight:700;
    border:none;cursor:pointer;transition:filter .12s;font-family:var(--font);
    color:#333;position:relative;
  }
  .status-tag:hover{filter:brightness(1.02);}
  .status-tag:active{filter:brightness(.92);}
  .st-0{background:#f8b4c4;}
  .st-1{background:#f0d080;color:#333;}
  .st-2{background:#b8d4e8;}
  .st-3{background:#d4b8e0;}

  /* Status picker modal - 弹窗里的选择按钮，简洁小 */
  .st-box{max-width:240px;}
  .st-options{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
  .st-opt{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:8px 12px;border-radius:8px;border:1px solid var(--border);
    cursor:pointer;transition:all .15s;font-family:var(--font);
    text-align:center;background:#fff;color:var(--text);font-weight:500;
  }
  .st-opt:hover{background:var(--accent-soft);border-color:var(--accent);}
  .st-opt:active{transform:scale(.98);}
  .st-opt-0:hover{background:#fef0f3;border-color:#f8b4c4;color:#e896a8;}
  .st-opt-1:hover{background:#fdf6e3;border-color:#f0d080;color:#b8902e;}
  .st-opt-2:hover{background:#eef4fa;border-color:#b8d4e8;color:#6a9bc4;}
  .st-opt-3:hover{background:#f5eefa;border-color:#d4b8e0;color:#a87cc0;}
  .st-ic{font-size:16px;}
  .st-txt{font-size:13px;font-weight:500;flex:none;}
  .st-cancel{
    width:100%;border:none;background:var(--bg);color:var(--soft);
    padding:8px;border-radius:8px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:var(--font);transition:all .2s;
  }
  .st-cancel:hover{background:var(--accent-soft);color:var(--accent);}
  /* Status only affects border, header uses theme color */

  /* Box Modal */
  .bm-modal{
    background:#fff;border-radius:16px;width:95%;max-width:520px;
    max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
    animation:bmPop .25s ease;
  }
  @keyframes bmPop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .bm-head{
    display:flex;align-items:center;gap:8px;padding:14px 16px;
    border-bottom:1px solid var(--border-light);
  }
  .bm-ic{font-size:18px;}
  .bm-title-inp{
    flex:1;font-size:15px;font-weight:700;border:none;outline:none;
    background:transparent;font-family:var(--font);color:var(--text);
  }
  .bm-title-inp::placeholder{color:var(--border);font-weight:400;}
  .bm-close{
    background:none;border:none;font-size:16px;color:var(--light);
    cursor:pointer;padding:4px;
  }
  .bm-close:hover{color:var(--pink-deep);}
  .bm-list{
    flex:1;overflow-y:auto;padding:8px 16px;
  }
  .bm-row{
    display:flex;align-items:center;gap:6px;padding:8px 0;
    border-bottom:1px solid var(--border-light);font-size:14px;
  }
  .bm-num{color:var(--light);font-size:11px;width:18px;flex-shrink:0;text-align:center;}
  .bm-inp{
    border:none;border-bottom:1px dashed var(--border);outline:none;
    background:transparent;font-family:var(--font);color:var(--text);
    padding:3px 2px;transition:all .15s;
  }
  .bm-name{flex:none;width:100%;min-width:0;font-size:15px;font-weight:600;}
  .bm-qty{flex:0 0 46px;width:46px;min-width:0;text-align:center;font-size:15px;font-weight:600;}
  .bm-row .ns-wrap{flex:1 1 auto;width:auto;min-width:0;}
  .bm-inp:focus{border-bottom:1.5px solid #f8b4c4;background:#fef0f3;}
  .bm-x{color:var(--light);font-size:13px;flex-shrink:0;}
  .bm-sep{color:var(--soft);font-size:13px;font-weight:600;flex-shrink:0;}
  .bm-del{
    background:none;border:none;color:var(--light);font-size:13px;
    cursor:pointer;padding:2px 4px;flex-shrink:0;
  }
  .bm-del:hover{color:var(--pink-deep);}
  .bm-add{
    text-align:center;padding:10px;cursor:pointer;color:var(--light);
    font-size:13px;font-weight:600;
  }
  .bm-add:hover{color:var(--accent);}
  .bm-foot{
    padding:12px 16px;border-top:1px solid var(--border-light);
    display:flex;gap:8px;
  }
  .bm-copy{
    flex:1;padding:11px;border:1px solid var(--border);border-radius:10px;
    background:#fff;color:var(--soft);font-size:13px;font-weight:700;
    cursor:pointer;transition:filter .12s;
  }
  .bm-copy:hover{border-color:#c8c2c6;color:var(--accent);filter:brightness(1.02);}
  .bm-copy:active{filter:brightness(.95);}
  .bm-delbox{
    flex:0 0 auto;padding:11px 12px;border:1px solid #f0c4c4;border-radius:10px;
    background:#fff;color:#d98a8a;font-size:13px;font-weight:700;
    cursor:pointer;transition:all .12s;
  }
  .bm-delbox:hover{background:#fdeeee;border-color:#e0a0a0;}
  .bm-delbox:active{filter:brightness(.95);}
  .bm-fill{
    flex:1;padding:11px;border:none;border-radius:10px;
    background:#f0d080;color:#333;font-size:13px;font-weight:700;
    cursor:pointer;transition:filter .12s;

<script>
let groups = [];
let trash = [];
let groupTrash = [];
let _searchQuery = '';
let _statusFilter = -1; // -1 = all

function load(){
  try{ const r=localStorage.getItem('xz_v4'); if(r) groups=JSON.parse(r); }catch(e){}
  if(!groups.length) groups=[newGroup()];
  // Ensure boxes array exists on old data, and normalize date format
  groups.forEach(g=>{
    if(!g.boxes) g.boxes=[];
    if(g.status===undefined) g.status=0;
    // Normalize date format to YYYY/M/D
    if(g.date){
      const t = new Date(g.date);
      if(!isNaN(t.getTime())){
        g.date = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`;
      }
    }
    g.boxes.forEach(b=>{
      if(!b.id) b.id = Date.now()+Math.random();
      if(!b.photos) b.photos = [];
    });
  });
}
function save(){ sortGroupsByDate(); localStorage.setItem('xz_v4',JSON.stringify(groups)); syncPush(); }

/* ===== GitHub Sync ===== */
let syncTimer=null;
let syncCfg=null;
function loadSyncCfg(){
  try{ syncCfg=JSON.parse(localStorage.getItem('xz_sync')||'null'); }catch(e){ syncCfg=null; }
  updateSyncStatusUI();
}
function updateSyncStatusUI(){
  const el=document.getElementById('syncStatus');
  if(!el) return;
  if(!syncCfg||!syncCfg.token){ el.textContent='未连接'; el.style.color=''; }
  else{ el.textContent='已连接'; el.style.color='#7a9b6e'; }
}
function openSyncSettings(){
  loadSyncCfg();
  document.getElementById('syncUser').value = syncCfg?.user||'';
  document.getElementById('syncRepo').value = syncCfg?.repo||'';
  document.getElementById('syncBranch').value = syncCfg?.branch||'main';
  document.getElementById('syncFile').value = syncCfg?.file||'data.json';
  document.getElementById('syncToken').value = syncCfg?.token||'';
  document.getElementById('syncSecret').value = syncCfg?.secret||'';
  document.getElementById('syncBg').classList.add('show');
}
function closeSyncSettings(){ document.getElementById('syncBg').classList.remove('show'); }
async function saveSyncSettings(){
  const user=document.getElementById('syncUser').value.trim();
  const repo=document.getElementById('syncRepo').value.trim();
  const branch=document.getElementById('syncBranch').value.trim()||'main';
  const file=document.getElementById('syncFile').value.trim()||'data.json';
  const token=document.getElementById('syncToken').value.trim();
  const secret=document.getElementById('syncSecret').value; // 密码不去空格，保留原样
  if(!user||!repo||!token){ toast('请填写完整信息'); return; }
  syncCfg={user,repo,branch,file,token,secret};
  localStorage.setItem('xz_sync',JSON.stringify(syncCfg));
  updateSyncStatusUI();
  closeSyncSettings();
  toast(secret?'已保存，正在加密同步...':'已保存，正在同步...');
  await syncPull(true);   // 先尝试拉取合并（密码正确才解得了）
  syncPush(true);         // 再用当前密码把数据加密推上云端
}
function ghApi(path,opts={}){
  const headers={'Authorization':`token ${syncCfg.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
  return fetch(`https://api.github.com/repos/${syncCfg.user}/${syncCfg.repo}/contents/${path}`,{...opts,headers}).then(r=>{
    if(r.status===404) return null;
    if(!r.ok) throw new Error('GitHub API '+r.status);
    return r.json();
  });
}

/* ====== 端到端加密（AES-GCM + PBKDF2，密码不落云端）====== */
function _u8ToB64(bytes){
  let bin=''; const arr=new Uint8Array(bytes);
  for(let i=0;i<arr.length;i++) bin+=String.fromCharCode(arr[i]);
  return btoa(bin);
}
function _b64ToU8(b64){
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
async function _deriveKey(pw, salt){
  const ik=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    ik, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
// 明文字符串 -> 可 JSON 序列化的加密对象
async function encryptStr(str, pw){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pw, salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(str));
  return {_enc:true, v:1, salt:_u8ToB64(salt), iv:_u8ToB64(iv), ct:_u8ToB64(ct)};
}
// 加密对象 -> 明文字符串；密码错误会抛异常
async function decryptObj(obj, pw){
  const key=await _deriveKey(pw, _b64ToU8(obj.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:_b64ToU8(obj.iv)}, key, _b64ToU8(obj.ct));
  return new TextDecoder().decode(pt);
}
async function syncPull(forceMerge=false){
  if(!syncCfg||!syncCfg.token) return;
  try{
    const data=await ghApi(syncCfg.file);
    if(!data){
      // 文件不存在，把当前数据推上去
      return syncPush(true);
    }
    let parsed;
    try{ parsed=JSON.parse(atob(data.content)); }
    catch(e){ console.error('云端数据解析失败',e); return; }

    let content;
    if(parsed && parsed._enc){
      // 云端是加密数据
      const pw=syncCfg.secret;
      if(!pw){ toast('☁️ 云端数据已加密，请在同步设置填写密码'); return; }
      try{ content=JSON.parse(await decryptObj(parsed,pw)); }
      catch(e){ toast('🔒 密码错误，无法解密云端数据'); console.error('decrypt error',e); return; }
    }else{
      content=parsed; // 旧版明文，兼容读取
    }

    const remoteTs=content._syncTs||0;
    const localTs=groups._syncTs||0;
    if(forceMerge||remoteTs>localTs){
      if(content.groups){
        groups=content.groups;
        groups._syncTs=remoteTs;
        localStorage.setItem('xz_v4',JSON.stringify(groups));
        render();
        if(!forceMerge) toast('已从云端同步');
      }
    }
  }catch(e){ console.error(e); toast('同步失败：'+e.message); }
}
function syncPush(force=false){
  if(!syncCfg||!syncCfg.token) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async ()=>{
    try{
      const now=Date.now();
      groups._syncTs=now;
      const plain=JSON.stringify({_syncTs:now,groups});
      // 有密码则加密，否则明文
      let outStr=plain;
      if(syncCfg.secret){
        const enc=await encryptStr(plain, syncCfg.secret);
        outStr=JSON.stringify(enc);
      }
      const data=await ghApi(syncCfg.file);
      const body={
        message:`sync ${new Date(now).toLocaleString()}`,
        content:btoa(unescape(encodeURIComponent(outStr))),
        branch:syncCfg.branch
      };
      if(data) body.sha=data.sha;
      const r=await fetch(`https://api.github.com/repos/${syncCfg.user}/${syncCfg.repo}/contents/${syncCfg.file}`,{
        method:'PUT',
        headers:{'Authorization':`token ${syncCfg.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(!r.ok) throw new Error('推送失败 '+r.status);
      updateSyncStatusUI();
    }catch(e){ console.error(e); toast(syncCfg.secret?'加密同步失败：'+e.message:'同步失败：'+e.message); }
  },force?0:1500);
}

function newGroup(){
  return {id:Date.now()+Math.random(), title:'', date:today(), rows:[newRow()], photos:[], collapsed:true, boxes:[], status:0};
}
function newRow(){ return {name:'',qty:'',price:''}; }
function newBox(){ return {id:Date.now()+Math.random(), title:'', rows:[{name:'',qty:''}], photos:[], collapsed:true}; }
function today(){ const d=new Date(); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function parseDate(str){
  const p=String(str).split('/');
  const y=parseInt(p[0])||2026, m=parseInt(p[1])||1, d=parseInt(p[2])||1;
  return new Date(y,m-1,d).getTime();
}
function sortGroupsByDate(){ groups.sort((a,b)=>parseDate(a.date)-parseDate(b.date)); }
function n(v){ v=parseFloat(v); if(isNaN(v)) return 0; if(Number.isInteger(v)) return v; return parseFloat(v.toFixed(2)); }
function calc(r){ return n((parseFloat(r.qty)||0)*(parseFloat(r.price)||0)); }
function validRows(g){ return g.rows.filter(r=>r.name.trim()&&r.qty&&r.price); }
function grpTotal(g){ return n(validRows(g).reduce((s,r)=>s+calc(r),0)); }

            <div class="ns-wrap">
              <input class="inp inp-name" type="text" placeholder="名称" value="${esc(r.name)}"

                onblur="hideNameSuggest(this)" autocomplete="off" />
              <div class="ns-dropdown"></div>
            </div>
            <span class="col-sep">|</span>
            <input class="inp inp-num" type="number" min="1" placeholder="0" value="${esc(r.qty)}"
              oninput="updRow(${gi},${ri},'qty',this.value)"

        if(e.target.classList && e.target.classList.contains('grp-date')){
          if(_lpFired){ _lpFired = false; return; }
          toggleGroup(gi);
          return;
        }
        // If clicking on title input, handle specially
        if(e.target.classList && e.target.classList.contains('grp-title')){
          if(clickTimer){
            clearTimeout(clickTimer);
            clickTimer=null;
            // Double click on title - don't toggle, let dblclick handle
            return;
          }
          clickTimer=setTimeout(()=>{
            clickTimer=null;
            toggleGroup(gi);
          },250);
          return;
        }
        toggleGroup(gi);
      });

    const z = document.getElementById('puz_'+gi);
    if(z){
      z.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();z.style.borderColor='#f8b4c4';z.style.background='#fef0f3';});
      z.addEventListener('dragleave',()=>{z.style.borderColor='var(--border)';z.style.background='#fff';});
      z.addEventListener('drop',e=>{
        e.preventDefault();e.stopPropagation();z.style.borderColor='var(--border)';z.style.background='#fff';
        handleGroupFiles(gi,e.dataTransfer.files);
      });
      z.addEventListener('click',e=>{e.stopPropagation();});
    }
    // Swipe-to-delete
    const sw = document.querySelector(`[data-swi="${gi}"]`);
    if(sw){
      const content = sw.querySelector('.swipe-content');
      const bg = sw.querySelector('.swipe-bg');
      let startX=0, currentX=0, dragging=false;

      // Touch events
      content.addEventListener('touchstart',(e)=>{
        startX = e.touches[0].clientX;
        dragging = true;
        content.style.transition = 'none';
      },{passive:true});
      content.addEventListener('touchmove',(e)=>{
        if(!dragging) return;
        currentX = e.touches[0].clientX - startX;
        if(currentX < 0 && currentX > -80){
          content.style.transform = `translateX(${currentX}px)`;
        }
      },{passive:true});
      content.addEventListener('touchend',()=>{
        if(!dragging) return;
        dragging = false;
        content.style.transition = 'transform .25s ease';
        if(currentX < -40){
          content.classList.add('swiped');
          content.style.transform = '';
        } else {
          content.classList.remove('swiped');
          content.style.transform = '';
        }
        currentX = 0;
      });

      // Mouse events for desktop（按住表头/空白处向左拖出删除）
      let _moved=false;
      content.addEventListener('mousedown',(e)=>{
        // 跳过按钮、可编辑输入框、添加行、子表数字、图片等交互区；只读标题/日期可起拖
        if(e.target.closest('button, textarea, .add-row, .box-num, .box-num-add, .pgm-item, .grp-restore, .grp-copy, .grp-restore-btn, .grid-more-btn')) return;
        if(e.target.closest('input') && !e.target.closest('input[readonly]')) return;
        startX = e.clientX; currentX = 0; dragging = true; _moved=false;
        content.style.transition = 'none';
        const onMove = (ev)=>{
          if(!dragging) return;
          currentX = ev.clientX - startX;
          if(Math.abs(currentX) > 8){
            _moved = true;
            if(typeof longPressEnd==='function') longPressEnd(); // 拖动时取消日期长按
            ev.preventDefault();
          }
          if(currentX < 0){
            content.style.transform = `translateX(${Math.max(currentX,-80)}px)`;
          }
        };
        const onUp = ()=>{
          if(!dragging) return;
          dragging = false;
          content.style.transition = 'transform .25s ease';
          if(currentX < -40){ content.classList.add('swiped'); }
          else { content.classList.remove('swiped'); }
          content.style.transform = '';
          // 真实拖动后吞掉本次松手合成的 click，避免误折叠/立刻收回
          if(_moved){ _swallowClick = true; setTimeout(()=>{_swallowClick=false;},120); }
          currentX = 0;
          document.removeEventListener('mousemove',onMove);
          document.removeEventListener('mouseup',onUp);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
      });

      // Click on background = delete
      bg.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(content.classList.contains('swiped')){
          delGroup(gi);
        }
      });

      // Click elsewhere = slide back
      content.addEventListener('click',(e)=>{
        if(content.classList.contains('swiped') && !e.target.closest('.grp-del')){
          // Click on content while swiped = slide back
          if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON'){
            e.stopPropagation();
            content.classList.remove('swiped');
          }
        }
      });
    }
  });
}

/* ====== Box ops (子表) ====== */
function addBox(gi){ groups[gi].boxes.push(newBox()); save(); openBoxModal(gi, groups[gi].boxes.length-1); }
function delBox(gi,bi){
  const b = groups[gi].boxes[bi];
  const title = b.title || ('子表'+(bi+1));
  showConfirm(`删除「${title}」？`, '子表内容将被删除', '🗑', ()=>{
    // If linked, remove contributions from parent first
    if(b.linked){
      const g = groups[gi];
      const boxId = b.id;
      g.rows = g.rows.filter(r=>{
        if(r.fromBoxId === boxId) return false;
        if(r.boxContrib && r.boxContrib[boxId] !== undefined){
          const contrib = parseFloat(r.boxContrib[boxId])||0;
          const cur = parseFloat(r.qty)||0;
          r.qty = String(n(Math.max(0, cur - contrib)));
          delete r.boxContrib[boxId];
          if(Object.keys(r.boxContrib).length === 0) delete r.boxContrib;
        }
        return true;
      });
    }
    groups[gi].boxes.splice(bi,1); save(); render();
  });
}
function updBoxTitle(gi,bi,val){
  if(!groups[gi].boxes[bi]) return;
  groups[gi].boxes[bi].title = val;
  save();
}

function boxRowEnter(e, gi, bi, field){
  if(e.key!=='Enter') return;
  if(field==='name' && _nsActive && _nsItems.length && _nsIdx>=0){
    const dd=_nsActive.parentElement && _nsActive.parentElement.querySelector('.ns-dropdown');
    if(dd && dd.classList.contains('show')) return;

  e.preventDefault();
  const row=e.target.closest('.bm-row');
  if(!row) return;
  const focusEl=(el)=>{ if(el){ el.focus(); try{el.select();}catch(_){} } };
  if(field==='name'){
    focusEl(row.querySelector('.bm-qty'));
  }else if(field==='qty'){
    const list=document.getElementById('boxModalList');
    const rows=[...list.querySelectorAll('.bm-row')];
    const next=rows[rows.indexOf(row)+1];
    if(next){ focusEl(next.querySelector('.bm-name')); }

      addBoxRow(gi,bi);
      const all=list.querySelectorAll('.bm-row');
      focusEl(all[all.length-1] && all[all.length-1].querySelector('.bm-name'));
    }
  }

function delBoxRow(gi,bi,ri){
  const r = groups[gi].boxes[bi].rows[ri];
  if(!r.name.trim() && !r.qty){
    if(groups[gi].boxes[bi].rows.length<=1) groups[gi].boxes[bi].rows=[{name:'',qty:''}];
    else groups[gi].boxes[bi].rows.splice(ri,1);
    save(); renderBoxModalList(gi,bi);
    autoSyncBox(gi,bi);
    return;
  }
  showConfirm(`删除「${r.name||'未命名'}」？`, '删除后子表母表同步移除', '🗑', ()=>{
    if(groups[gi].boxes[bi].rows.length<=1) groups[gi].boxes[bi].rows=[{name:'',qty:''}];
    else groups[gi].boxes[bi].rows.splice(ri,1);
    save(); renderBoxModalList(gi,bi);
    autoSyncBox(gi,bi);
    toast('已删除');
  });
}

function copyBox(){
  if(_boxModalGI===null||_boxModalBI===null){ toast('无可复制子表'); return; }
  const b = groups[_boxModalGI].boxes[_boxModalBI];

/* ====== Fill box to parent table (with linkage) ====== */
function fillBoxToParent(){
  if(_boxModalGI===null||_boxModalBI===null){ toast('无可填充子表'); return; }
  const gi=_boxModalGI, bi=_boxModalBI;
  const result = syncBoxToParent(gi, bi, true);
  if(result){
    closeBoxModal();
    toast(`已联动母表（新增${result.added}项，合并${result.merged}项）`);
  }

// Sync box data to parent table. Returns {added, merged} or null if no data.
function syncBoxToParent(gi, bi, isInitial){
  const g = groups[gi];
  const b = g.boxes[bi];
  if(!b) return null;
  const boxId = b.id;

  // Step 1: Remove old contributions from this box
  g.rows = g.rows.filter(r=>{
    if(r.fromBoxId === boxId) return false; // remove rows created by this box
    if(r.boxContrib && r.boxContrib[boxId] !== undefined){
      const contrib = parseFloat(r.boxContrib[boxId])||0;
      const cur = parseFloat(r.qty)||0;
      r.qty = String(n(Math.max(0, cur - contrib)));
      delete r.boxContrib[boxId];
      if(Object.keys(r.boxContrib).length === 0) delete r.boxContrib;
    }
    return true;
  });

  // Step 2: Merge current box rows by name
  const merged = {};
  const order = [];
  b.rows.forEach(r=>{
    if(!r.name.trim()) return;
    const name = r.name.trim();
    if(!merged[name]){ merged[name] = 0; order.push(name); }
    merged[name] += parseFloat(r.qty)||0;
  });

  if(!order.length){
    b.linked = false;
    save();
    return null;
  }

  // Step 3: Add to parent
  let added = 0, mergedCount = 0;
  order.forEach(name=>{
    const qty = n(merged[name]);
    const existIdx = g.rows.findIndex(r=>r.name.trim()===name && r.fromBoxId !== boxId);
    if(existIdx>=0){
      const cur = parseFloat(g.rows[existIdx].qty)||0;
      g.rows[existIdx].qty = String(n(cur + qty));
      if(!g.rows[existIdx].boxContrib) g.rows[existIdx].boxContrib = {};
      g.rows[existIdx].boxContrib[boxId] = qty;
      mergedCount++;
    } else {
      const emptyIdx = g.rows.findIndex(r=>!r.name.trim()&&!r.qty&&!r.price);
      if(emptyIdx>=0){
        g.rows[emptyIdx].name = name;
        g.rows[emptyIdx].qty = String(qty);
        g.rows[emptyIdx].fromBoxId = boxId;
      } else {
        g.rows.push({name:name, qty:String(qty), price:'', fromBoxId:boxId});
      }
      added++;
    }
  });

  b.linked = true;

  // Ensure empty row at end
  const last = g.rows[g.rows.length-1];
  if(last && (last.name.trim()||last.qty||last.price)){
    g.rows.push(newRow());
  }

  save();
  return {added, merged: mergedCount};
}

// Auto-sync when box changes if linked
function autoSyncBox(gi, bi){
  const b = groups[gi] && groups[gi].boxes[bi];
  if(b && b.linked){
    syncBoxToParent(gi, bi, false);
    // Re-render groups (modal is outside #groups so it won't be affected)
    render();
    // Explicitly update totals for safety
    renderTotals(gi);
  }
}

/* ====== Name Suggestion ====== */
function collectAllNames(){
  const map = {};
  groups.forEach((g)=>{
    g.rows.forEach(r=>{
      const nm = r.name.trim();
      if(nm){
        if(!map[nm]) map[nm] = 0;
        map[nm] += parseFloat(r.qty)||0;
      }
    });
    (g.boxes||[]).forEach((b)=>{
      b.rows.forEach(r=>{
        const nm = r.name.trim();
        if(nm){
          if(!map[nm]) map[nm] = 0;
          map[nm] += parseFloat(r.qty)||0;
        }
      });
    });
  });
  return map;
}

let _nsActive = null;
let _nsItems = [];
let _nsIdx = -1;

function showNameSuggest(inp, type, gi, param2, param3){
  _nsActive = inp;
  const dd = inp.parentElement.querySelector('.ns-dropdown');
  if(!dd) return;
  // For parent: param2=ri, param3=undefined; for box: param2=bi, param3=ri
  const bi = (type==='box') ? param2 : null;
  const ri = (type==='box') ? param3 : param2;
  const val = inp.value.trim().toLowerCase();
  if(!val){ dd.classList.remove('show'); return; }
  const allNames = collectAllNames();
  // Count occurrences EXCLUDING the current row being edited
  const nameCounts = {};
  groups.forEach((g,gidx)=>{
    g.rows.forEach((r,ridx)=>{
      const nm = r.name.trim();
      if(!nm) return;
      // Skip current row in parent table
      if(type==='parent' && gidx===gi && ridx===ri) return;
      nameCounts[nm] = (nameCounts[nm]||0) + 1;
    });
    (g.boxes||[]).forEach((b,bidx)=>{
      b.rows.forEach((r,ridx)=>{
        const nm = r.name.trim();
        if(!nm) return;
        // Skip current row in box
        if(type==='box' && gidx===gi && bidx===bi && ridx===ri) return;
        nameCounts[nm] = (nameCounts[nm]||0) + 1;
      });
    });
  });
  // Only show names that exist elsewhere (count >= 1)
  let matches = Object.keys(nameCounts).filter(nm=>{
    if(nameCounts[nm] < 1) return false;
    return nm.toLowerCase().includes(val) || val.includes(nm.toLowerCase());
  });
  if(val){
    // Prioritize starts-with matches
    matches.sort((a,b)=>{
      const aStarts = a.toLowerCase().startsWith(val) ? 0 : 1;
      const bStarts = b.toLowerCase().startsWith(val) ? 0 : 1;
      return aStarts - bStarts;
    });
  }
  matches = matches.slice(0,8);
  _nsItems = matches;
  _nsIdx = -1;
  if(!matches.length){ dd.classList.remove('show'); return; }
  dd.innerHTML = matches.map((nm,i)=>{
    return `<div class="ns-item" data-name="${esc(nm)}" data-idx="${i}" onmousedown="event.preventDefault();pickNameSuggest('${esc(nm)}')">${esc(nm)}</div>`;
  }).join('');
  dd.classList.add('show');
}

function hideNameSuggest(inp){
  if(inp === _nsActive){
    setTimeout(()=>{
      const dd = inp.parentElement.querySelector('.ns-dropdown');
      if(dd) dd.classList.remove('show');
      _nsActive = null;
    },150);
  }
}

function pickNameSuggest(name){
  if(!_nsActive) return;
  _nsActive.value = name;
  // Trigger oninput
  _nsActive.dispatchEvent(new Event('input',{bubbles:true}));
  const dd = _nsActive.parentElement.querySelector('.ns-dropdown');
  if(dd) dd.classList.remove('show');
  _nsActive = null;
}

/* Keyboard navigation for name suggestion */
document.addEventListener('keydown',(e)=>{
  if(!_nsActive || !_nsItems.length) return;
  const dd = _nsActive.parentElement.querySelector('.ns-dropdown');
  if(!dd || !dd.classList.contains('show')) return;
  if(e.key==='ArrowDown'){
    e.preventDefault();
    _nsIdx = Math.min(_nsIdx+1, _nsItems.length-1);
    updateNsHighlight(dd);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    _nsIdx = Math.max(_nsIdx-1, 0);
    updateNsHighlight(dd);
  } else if(e.key==='Enter' && _nsIdx>=0){
    e.preventDefault();
    pickNameSuggest(_nsItems[_nsIdx]);
  } else if(e.key==='Escape'){
    dd.classList.remove('show');
    _nsActive = null;
  }
});
function updateNsHighlight(dd){
  dd.querySelectorAll('.ns-item').forEach((el,i)=>{
    el.classList.toggle('active', i===_nsIdx);
  });
  // Scroll active into view
  const active = dd.querySelector('.ns-item.active');
  if(active) active.scrollIntoView({block:'nearest'});
}

/* ====== Unlock title (double-click) ====== */
function unlockTitle(el,gi){
  el.classList.remove('locked');
  el.classList.add('unlocked');
  el.removeAttribute('readonly');
  el.focus();
  el.select();
  const relock = ()=>{
    el.classList.add('locked');
    el.classList.remove('unlocked');
    el.setAttribute('readonly','');
    el.removeEventListener('blur',relock);
    el.removeEventListener('keydown',onKey);
    el.removeEventListener('click',stopProp);
  };
  const onKey = (e)=>{
    if(e.key==='Enter'){ el.blur(); }
    if(e.key==='Escape'){ el.blur(); }
  };
  const stopProp = (e)=>{ e.stopPropagation(); };
  el.addEventListener('blur',relock);
  el.addEventListener('keydown',onKey);
  el.addEventListener('click',stopProp);
}

let _lpTimer = null;
let _lpFired = false;
const LP_DURATION = 500; // 长按 500ms 触发

function longPressStart(e, gi){
  longPressEnd(); // 先清掉上一个
  _lpFired = false;
  const target = e.currentTarget || e.target;
  _lpTimer = setTimeout(()=>{
    _lpFired = true;
    if(navigator.vibrate) navigator.vibrate(15);
    openDatePicker(gi);
  }, LP_DURATION);
  // 仅在长按已触发时阻止 touchend 后续合成的 click（避免误折叠）；轻点则放行 click 走折叠
  if(e.type === 'touchstart'){
    const onEnd = (ev)=>{
      target.removeEventListener('touchend', onEnd);
      target.removeEventListener('touchcancel', onEnd);
      if(_lpFired){ ev.preventDefault(); }
    };
    target.addEventListener('touchend', onEnd, {passive:false});
    target.addEventListener('touchcancel', onEnd, {passive:false});
  }
}
function longPressEnd(){
  if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer = null; }
}

/* ====== Date Picker ====== */
let dpGi = null;
let dpY=2026, dpM=9, dpD=8;

function openDatePicker(gi){
  dpGi = gi;
  const d = groups[gi].date;
  // Parse "2026/9/8" format
  const parts = d.split('/');
  dpY = parseInt(parts[0])||2026;
  dpM = parseInt(parts[1])||1;
  dpD = parseInt(parts[2])||1;
  buildWheels();
  document.getElementById('dpBg').classList.add('show');
}

function buildWheels(){
  const yearEl = document.getElementById('dpYear');
  const monthEl = document.getElementById('dpMonth');
  const dayEl = document.getElementById('dpDay');

  // Years: 2020-2030
  yearEl.innerHTML = '';
  for(let y=2020;y<=2030;y++){
    const it = document.createElement('div');
    it.className='dp-item'+(y===dpY?' active':'');
    it.textContent=y;
    it.dataset.val=y;
    yearEl.appendChild(it);
  }

  // Months 1-12
  monthEl.innerHTML = '';
  for(let m=1;m<=12;m++){
    const it = document.createElement('div');
    it.className='dp-item'+(m===dpM?' active':'');
    it.textContent=m;
    it.dataset.val=m;
    monthEl.appendChild(it);
  }

  // Days 1-31
  const days = new Date(dpY,dpM,0).getDate();
  dayEl.innerHTML = '';
  for(let d=1;d<=days;d++){
    const it = document.createElement('div');
    it.className='dp-item'+(d===dpD?' active':'');
    it.textContent=d;
    it.dataset.val=d;
    dayEl.appendChild(it);
  }

  // Scroll to positions (center alignment: item idx * 40, but wheel height 120px, center at 60px, so offset = idx*40 - 40)
  setTimeout(()=>{
    yearEl.scrollTop = (dpY-2020)*40 - 40;
    if(yearEl.scrollTop<0) yearEl.scrollTop=0;
    monthEl.scrollTop = (dpM-1)*40 - 40;
    if(monthEl.scrollTop<0) monthEl.scrollTop=0;
    dayEl.scrollTop = (dpD-1)*40 - 40;
    if(dayEl.scrollTop<0) dayEl.scrollTop=0;
    attachWheel(yearEl,'y');
    attachWheel(monthEl,'m');
    attachWheel(dayEl,'d');
  },10);
}

function attachWheel(el,type){
  const items = el.querySelectorAll('.dp-item');
  el.onscroll = ()=>{
    const idx = Math.round((el.scrollTop + 40)/40);
    const clamped = Math.max(0,Math.min(items.length-1,idx));
    items.forEach((it,i)=>it.classList.toggle('active',i===clamped));
    const val = parseInt(items[clamped].dataset.val);
    if(type==='y'){ dpY=val; rebuildDays(); }
    if(type==='m'){ dpM=val; rebuildDays(); }
    if(type==='d'){ dpD=val; }
  };
}

function rebuildDays(){
  const dayEl = document.getElementById('dpDay');
  const days = new Date(dpY,dpM,0).getDate();
  if(dpD>days) dpD=days;
  dayEl.innerHTML='';
  for(let d=1;d<=days;d++){
    const it=document.createElement('div');
    it.className='dp-item'+(d===dpD?' active':'');
    it.textContent=d; it.dataset.val=d;
    dayEl.appendChild(it);
  }
  dayEl.scrollTop=(dpD-1)*40-40;
  if(dayEl.scrollTop<0) dayEl.scrollTop=0;
  // Re-attach scroll
  const items = dayEl.querySelectorAll('.dp-item');
  dayEl.onscroll=()=>{
    const idx=Math.round((dayEl.scrollTop+40)/40);
    const clamped=Math.max(0,Math.min(items.length-1,idx));
    items.forEach((it,i)=>it.classList.toggle('active',i===clamped));
    const val=parseInt(items[clamped].dataset.val);
    if(val) dpD=val;
  };
}

/* 回车自动跳列：名称→数量→单价→下一行名称（末行则新增一行） */
function rowEnter(e, gi, ri, field){
  if(e.key!=='Enter') return;
  // 名称候选下拉有高亮项时，交给全局回车选中候选词，不跳列
  if(field==='name' && _nsActive && _nsItems.length && _nsIdx>=0){
    const dd=_nsActive.parentElement && _nsActive.parentElement.querySelector('.ns-dropdown');
    if(dd && dd.classList.contains('show')) return;
  }
  e.preventDefault();
  const row=e.target.closest('.row');
  if(!row) return;
  const focusEl=(el)=>{ if(el){ el.focus(); try{el.select();}catch(_){} } };
  if(field==='name'){
    focusEl(row.querySelector('.inp-num'));
  }else if(field==='qty'){
    focusEl(row.querySelector('.inp-price'));
  }else if(field==='price'){
    const rows=[...row.parentElement.querySelectorAll('.row')];
    const next=rows[rows.indexOf(row)+1];
    if(next){ focusEl(next.querySelector('.inp-name')); }
    else { addRow(gi); } // addRow 会自动聚焦新行名称
  }
}
function delRow(gi,ri){

// Centralized total update for a group
function renderTotals(gi){
  const g = groups[gi];
  if(!g) return;
  const grpEl = document.querySelector(`.group[data-gid="${g.id}"]`);
  if(!grpEl) return;
  const total = grpTotal(g);
  const count = validRows(g).length;
  // Header mini total
  const mini = grpEl.querySelector('.grp-sum-mini');
  if(mini) mini.textContent = total;
  // Footer total + count
  const sumN = grpEl.querySelector('.grp-sum .n');
  if(sumN) sumN.textContent = count;
  const sumTotal = grpEl.querySelector('.grp-sum-total');
  if(sumTotal) sumTotal.textContent = total;
  // Per-row totals
  g.rows.forEach((r,ri)=>{
    const rowEl = grpEl.querySelector(`.row[data-rid="${ri}"]`);
    if(rowEl){
      const t = rowEl.querySelector('.total');
      if(t) t.textContent = calc(r);
    }
  });
}

    const reader = new FileReader();
    reader.onload = ev=>{
      compress(ev.target.result,1080,.82,data=>{
        groups[gi].boxes[bi].photos.push(data);
        save();
        renderBoxPhotos(gi,bi);
      });
    };
    reader.readAsDataURL(f);
  });
}
function rmBoxPhoto(j){
  if(_boxModalGI===null||_boxModalBI===null) return;
  const gi=_boxModalGI, bi=_boxModalBI;
  groups[gi].boxes[bi].photos.splice(j,1);
  save();
  renderBoxPhotos(gi,bi);
}
function renderBoxPhotos(gi,bi){
  const b = groups[gi].boxes[bi];
  const grid = document.getElementById('bmPhotoGrid');
  if(!grid) return;
  if(!b.photos.length){ grid.innerHTML=''; return; }
  grid.innerHTML = b.photos.map((p,j)=>`
    <div class="pgm-item"><img src="${p}" onclick="viewImg('${p}')"/><button class="rm" onclick="rmBoxPhoto(${j})">✕</button></div>
  `).join('');
}
function compress(src,mw,q,cb){
  const im=new Image();
  im.onload=()=>{let{width:w,height:h}=im;if(w>mw){h=h*mw/w;w=mw;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',q));};
  im.src=src;
}

/* ====== Copy ====== */
function copyGroup(gi){
  const g = groups[gi];
  const valid = validRows(g);
  if(!valid.length){ toast('请先填写产品'); return; }
  let txt = valid.map(r=>{
    const q=n(r.qty), p=n(r.price), t=n(q*p);
    return `${r.name}*${q}，${q}*${p}=${t}`;
  }).join('\n');
  let allTotal = valid.reduce((s,r)=>s+calc(r),0);
  txt += '\n合计' + n(allTotal) + '元';
  doCopy(txt);
}

function doCopy(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('✅ 已复制')).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');toast('✅ 已复制');}catch(e){toast('❌ 复制失败');}
  document.body.removeChild(ta);
}

/* ====== Export / Clear ====== */
function exportJSON(){
  const data = groups.map(g=>({title:g.title,date:g.date,rows:validRows(g),photos:g.photos}));
  if(!data.some(d=>d.rows.length)){toast('暂无数据');return;}
  dl(JSON.stringify(data,null,2),'records.json','application/json');toast('JSON 已导出');
}
function dl(content,filename,mime){const blob=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);}
function clearAll(){
  showConfirm('清空全部？', '所有记录将被删除，不可恢复', '🗑', ()=>{
    groups=[newGroup()];trash=[];groupTrash=[];save();render();toast('已清空');
  });
}

/* Utils */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}

// Click elsewhere to reset all swiped groups

// 电脑端鼠标拖动后吞掉合成的 click（捕获阶段最先执行，阻止折叠/收回）
let _swallowClick=false;
document.addEventListener('click',(e)=>{

    _swallowClick=false;
    e.stopPropagation();
    e.preventDefault();
  }
},true);

// 全局禁用长按/右键菜单，但放行输入框（方便粘贴）
document.addEventListener('contextmenu',(e)=>{
  const t = e.target;
  const tag = t && t.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  e.preventDefault();
}, {passive:false});
// 禁止双击/长按选中文字放大（输入框除外，已由 CSS 处理）
document.addEventListener('gesturestart',(e)=>e.preventDefault());

load();render();loadSyncCfg();syncPull();
// 每隔一段时间自动拉取一次
setInterval(()=>{ if(syncCfg&&syncCfg.token) syncPull(); },30000);

// ===== Image viewer =====
function viewImg(src){
  var v=document.getElementById('imgViewer');
  var img=v.querySelector('img');
  img.src=src;
  v.classList.add('show');
}
function closeImgViewer(e){
  if(e) e.stopPropagation();

}

/* ====== Search & Filter ====== */

function applyFilter(){
  const inp = document.getElementById('searchInput');
  _searchQuery = inp.value.trim().toLowerCase();
  const clearBtn = document.getElementById('searchClear');
  clearBtn.style.display = _searchQuery ? 'block' : 'none';
  render();
}

function setFilter(status){
  _statusFilter = status;
  document.querySelectorAll('.ftab').forEach(t=>{
    t.classList.toggle('active', parseInt(t.dataset.filter)===status);
  });
  render();
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  _searchQuery = '';
  document.getElementById('searchClear').style.display = 'none';
  render();
}

function getFilteredGroups(){
  return groups.map((g,gi)=>{
    // Check status filter
    if(_statusFilter >= 0 && g.status !== _statusFilter) return null;
    // Check search query
    if(_searchQuery){
      const titleMatch = g.title.toLowerCase().includes(_searchQuery);
      const dateMatch = g.date.toLowerCase().includes(_searchQuery);
      const rowMatch = g.rows.some(r=>r.name.toLowerCase().includes(_searchQuery));
      const boxMatch = (g.boxes||[]).some(b=>b.rows.some(r=>r.name.toLowerCase().includes(_searchQuery)));
      if(!titleMatch && !dateMatch && !rowMatch && !boxMatch) return null;
    }
    return gi;
  }).filter(gi => gi !== null);
}

function getFilteredGroupIndices(){
  return getFilteredGroups();
}

/* ====== Keyboard Shortcuts ====== */
function toggleShortcuts(){
  const el = document.getElementById('kbBg');
  el.classList.toggle('show');
}
function closeShortcuts(){
  document.getElementById('kbBg').classList.remove('show');
}

document.addEventListener('keydown',(e)=>{
  // Skip if typing in an input/textarea
  const tag = e.target.tagName;
  const isTyping = tag==='INPUT' || tag==='TEXTAREA' || e.target.isContentEditable;

  // Esc: close any modal
  if(e.key==='Escape'){
    closeShortcuts();
    return;
  }

  // Ctrl/Cmd + S: manual sync
  if((e.ctrlKey||e.metaKey) && e.key==='s'){
    e.preventDefault();
    if(syncCfg && syncCfg.token){
      syncPush(true);
      toast('正在同步…');
    } else {
      openSyncSettings();
    }
    return;
  }

  // Ctrl/Cmd + N: new group
  if((e.ctrlKey||e.metaKey) && e.key==='n'){
    e.preventDefault();
    addGroup();
    return;
  }

  // Ctrl/Cmd + Backspace: clear search
  if((e.ctrlKey||e.metaKey) && e.key==='Backspace'){
    if(document.activeElement && document.activeElement.id==='searchInput'){
      e.preventDefault();
      clearSearch();
    }
    return;
  }

  // Skip remaining shortcuts if typing
  if(isTyping) return;

  // ? : show shortcuts
  if(e.key==='?' || (e.shiftKey && e.key==='/')){
    e.preventDefault();
    toggleShortcuts();
    return;
  }

  // / : focus search
  if(e.key==='/'){
    e.preventDefault();
    const si = document.getElementById('searchInput');
    if(si) si.focus();
    return;
  }

  // n : new group
  if(e.key==='n' || e.key==='N'){
    // Check no modifier
    if(!e.ctrlKey && !e.metaKey && !e.altKey){
      // Don't interfere if a modal is open
      const modalOpen = document.querySelector('.cfm-bg.show, .dp-bg.show, .kb-bg.show, .img-viewer.show');
      if(!modalOpen){
        e.preventDefault();
        addGroup();
      }
    }
  }
});
</script>
